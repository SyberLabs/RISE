<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#030306">
  <meta name="robots" content="noindex">
  <title>RISE · Oracle prototype</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="stylesheet" href="/src/fonts.css">
  <link rel="stylesheet" href="/src/oracle/oracle.css">
</head>
<body>
  <header class="oracle-top">
    <a class="oracle-lockup" href="/"><img src="/syberlabs-mark.webp" alt="" width="16" height="18">RISE</a>
    <span class="oracle-proto">Oracle · design prototype</span>
  </header>
  <main class="oracle">
    <h1 class="oracle-title">Ask for a reading.<span> Or shake for one.</span></h1>
    <div class="oracle-stage" aria-label="The Oracle. Drag to tilt it; flick or shake it for a suggestion.">
      <canvas class="oracle-canvas" aria-hidden="true"></canvas>
      <div class="oracle-shadow" aria-hidden="true"></div>
      <div class="oracle-space">
        <div class="oracle-glass">
          <label class="oracle-label" for="oracle-intent">What would you like to read?</label>
          <textarea id="oracle-intent" rows="4" maxlength="240" spellcheck="false" placeholder="ask for a reading_" aria-describedby="oracle-status"></textarea>
        </div>
        <div class="oracle-plate" aria-hidden="true"><b>RISE</b> MODEL J-82 · PHOSPHOR VOLUME</div>
      </div>
    </div>
    <div class="oracle-keys">
      <button class="oracle-key oracle-key-shake" type="button"><span class="oracle-key-cap">Shake</span><small>for an idea</small></button>
      <button class="oracle-key oracle-key-ask" type="button"><span class="oracle-key-cap">Ask Jev</span><small>enter ↵</small></button>
    </div>
    <p class="oracle-status" id="oracle-status" role="status" aria-live="polite"></p>
  </main>
  <script type="module" src="/src/oracle/oracle.js"></script>
</body>
</html>
