<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RISE Chamber stage</title>
  <link rel="stylesheet" href="/src/design-system.css">
  <link rel="stylesheet" href="/src/components/Chamber.css">
  <link rel="stylesheet" href="/src/visuals/visuals.css">
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--color-void, #0A0A0C);
    }
    .chamber {
      min-height: 100%;
      height: 100%;
    }
    .chamber-display {
      min-height: 100% !important;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    .chamber-field {
      flex: 1;
    }
    /* MP4 caption path only. Live Chamber does not load this document. */
    .chamber.caption-mode .chamber-field {
      position: relative;
    }
    .chamber.caption-mode .atom-band,
    .chamber.caption-mode .chamber-field-genesis .atom-band,
    .chamber.caption-mode .chamber-field-stream .atom-band,
    .chamber.caption-mode .chamber-field-genesis .atom-band:has(.atom-display),
    .chamber.caption-mode .chamber-field-stream .atom-band:has(.atom-display) {
      display: block;
      position: absolute;
      left: calc(var(--caption-x, 0.5) * 100%);
      top: calc(var(--caption-y, 0.9) * 100%);
      transform: translate(-50%, -50%);
      width: 90%;
      z-index: 10;
      background: none;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      border: 0;
      box-shadow: none;
    }
    .chamber.caption-mode .atom-display,
    .chamber.caption-mode .atom-display.glass-tile,
    .chamber.caption-mode .chamber-field-genesis .atom-display.glass-tile,
    .chamber.caption-mode .chamber-field-stream .atom-display.glass-tile {
      font-family: var(--caption-font, "Helvetica Neue", Arial, sans-serif);
      font-size: var(--caption-size, 21px);
      font-weight: 600;
      color: var(--caption-color, #FFFFFF);
      -webkit-text-stroke: 0.06em var(--caption-edge, #000000);
      paint-order: stroke fill;
      background: none;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      box-shadow: none;
      border: 0;
      border-radius: 0;
      max-width: 100%;
      width: 100%;
      transform: none;
      padding: 0;
    }
  </style>
</head>
<body>
  <div class="chamber">
    <div class="chamber-display" id="chamber-display">
      <div class="chamber-field" id="chamber-field">
        <div class="chamber-genesis" id="visual-host" aria-hidden="true"></div>
        <div class="atom-band" id="atom-band">
          <div class="atom-display glass-tile" id="atom-display"></div>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/core/render/chamber-stage.js"></script>
</body>
</html>
