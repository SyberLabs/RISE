<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500"><title>A change no beat cites</title><text x="56" y="70" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-size="40" fill="#EDF6FF" text-anchor="start">A change no beat cites</text><text x="56" y="146" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="25" fill="#EDF6FF" fill-opacity="0.6" text-anchor="start">Before</text><text x="428" y="146" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="25" fill="#58B8FF" text-anchor="start">After</text><line x1="56" y1="162" x2="744" y2="162" stroke="#EDF6FF" stroke-opacity="0.2" stroke-width="1.5" stroke-linecap="round"/><text x="56" y="204" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-size="25" fill="#EDF6FF" fill-opacity="0.6" text-anchor="start" font-style="italic">The reading</text><text x="56" y="240" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="25" fill="#EDF6FF" fill-opacity="0.8" text-anchor="start">Repaired to cite it</text><line x1="384" y1="231" x2="416" y2="231" stroke="#EDF6FF" stroke-opacity="0.55" stroke-width="1.5" stroke-linecap="round"/><path d="M408 224 L416 231 L408 238" fill="none" stroke="#EDF6FF" stroke-opacity="0.55" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><text x="428" y="240" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="25" fill="#58B8FF" text-anchor="start" font-weight="600">Left out</text><text x="56" y="308" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-size="25" fill="#EDF6FF" fill-opacity="0.6" text-anchor="start" font-style="italic">The page</text><text x="56" y="344" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="25" fill="#EDF6FF" fill-opacity="0.8" text-anchor="start">Says nothing</text><line x1="384" y1="335" x2="416" y2="335" stroke="#EDF6FF" stroke-opacity="0.55" stroke-width="1.5" stroke-linecap="round"/><path d="M408 328 L416 335 L408 342" fill="none" stroke="#EDF6FF" stroke-opacity="0.55" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><text x="428" y="344" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="25" fill="#58B8FF" text-anchor="start" font-weight="600">Lists it as unspoken</text><text x="56" y="412" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-size="25" fill="#EDF6FF" fill-opacity="0.6" text-anchor="start" font-style="italic">The run</text><text x="56" y="448" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="25" fill="#EDF6FF" fill-opacity="0.8" text-anchor="start">A repair</text><line x1="384" y1="439" x2="416" y2="439" stroke="#EDF6FF" stroke-opacity="0.55" stroke-width="1.5" stroke-linecap="round"/><path d="M408 432 L416 439 L408 446" fill="none" stroke="#EDF6FF" stroke-opacity="0.55" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><text x="428" y="448" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="25" fill="#58B8FF" text-anchor="start" font-weight="600">A note</text></svg>
