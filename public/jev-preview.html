<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Jev preview · RISE</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="stylesheet" href="/fonts/fonts.css">
  <style>
    :root { color-scheme: dark; font-family: 'Inter', system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 2rem 1rem 4rem; background: #09090d; color: #e8e8ec; }
    main { max-width: 42rem; margin: 0 auto; }
    a { color: #9ecbad; }
    .back { display: inline-block; margin-bottom: 2.5rem; font-size: .85rem; }
    h1 { margin: 0 0 .6rem; font: 300 clamp(2rem, 7vw, 3.2rem)/1.1 'Marcellus', Georgia, serif; }
    p { color: #bcbcc7; line-height: 1.6; }
    form { display: grid; gap: 1rem; margin-top: 2rem; }
    label { display: grid; gap: .4rem; font-size: .9rem; }
    input, textarea, select, button { width: 100%; font: inherit; border-radius: .5rem; }
    input, textarea, select { border: 1px solid #4b4b55; padding: .75rem; background: #15151b; color: #f4f4f5; }
    textarea { min-height: 6rem; resize: vertical; }
    input:focus-visible, textarea:focus-visible, select:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid #9ecbad; outline-offset: 2px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    button { border: 0; padding: .85rem 1rem; background: #9ecbad; color: #101410; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    output { display: block; min-height: 4rem; margin-top: 1.5rem; padding: 1rem; border: 1px solid #393943; border-radius: .5rem; white-space: pre-line; line-height: 1.7; }
    @media (max-width: 32rem) { .row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <a class="back" href="/">← Back to RISE</a>
    <h1>Try Jev with RISE</h1>
    <p>This is a one-decision preview. Clicking the button sends the sample below through RISE to OpenRouter Jev. It does not change the RISE reading experience. Use sample text only; do not enter private information.</p>
    <form id="jev-form" novalidate>
      <label for="jev-intent">Reading intent
        <input id="jev-intent" name="intent" maxlength="500" required value="Help me stay with this passage.">
      </label>
      <label for="jev-feedback">Reader feedback
        <textarea id="jev-feedback" name="feedback" maxlength="500">I would like a little more time to read.</textarea>
      </label>
      <label for="jev-excerpt">Short passage
        <textarea id="jev-excerpt" name="excerpt" maxlength="2000">The light moved slowly across the room, and the reader paused to notice it.</textarea>
      </label>
      <div class="row">
        <label for="jev-mode">Mode
          <select id="jev-mode" name="mode"><option value="reading">Reading</option><option value="devotional">Devotional</option></select>
        </label>
        <label for="jev-pace">Current pace (words per minute)
          <input id="jev-pace" name="pace" type="number" min="100" max="500" value="220" required>
        </label>
      </div>
      <button id="jev-submit" type="submit">Ask Jev for one decision</button>
    </form>
    <output id="jev-result" role="status" aria-live="polite">No request sent yet.</output>
    <p><a href="/privacy.html">Privacy policy</a></p>
  </main>
  <script type="module" src="/jev-preview.js"></script>
</body>
</html>
