# Netlify Configuration for R.I.S.E.
# Audiovisual Reader

[build]
  # Build command
  command = "npm run build"

  # Output directory (Vite default)
  publish = "dist"

# SPA routing - redirect all requests to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # CSP: self-hosted scripts only; APIs limited to the content providers the app
    # actually calls (Gutenberg, arXiv, Wikimedia Commons, Met, Art Institute, corsproxy).
    # img-src allows any https CDN because museum APIs return varied image hosts.
    #
    # Runtime Recitation is static and same-origin. Kokoro is used only by
    # the local pack builder, so deployed readers need no model host, API,
    # third-party script, or WebAssembly policy exception.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self' https://www.gutenberg.org https://corsproxy.io https://export.arxiv.org https://commons.wikimedia.org https://upload.wikimedia.org https://api.artic.edu https://www.artic.edu https://collectionapi.metmuseum.org https://openaccess-api.clevelandart.org https://id.rijksmuseum.nl; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"

# The shell must never be cached: it names the hashed chunks, so a
# stale index.html sends a browser after files the current deploy has
# replaced. That is what strands a tab left open across a release — it
# asks for Portal-<old hash>.js, gets a 404, and can no longer reach
# any view it had not already loaded. (The router now detects this and
# reloads once to recover; this header keeps the recovery from looping.)
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Netlify serves .webmanifest as application/octet-stream; Chrome requires
# a JSON media type or it declines to parse the manifest.
[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Cache static assets aggressively — safe because they are content-hashed
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache fonts
[[headers]]
  for = "*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Static Recitation assets are content-addressed by normalized phrase text.
[[headers]]
  for = "/audio/recitation/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# THE DATA PLANE. A work is an immutable object named by the SHA-256 of its
# own bytes, so it can be cached forever with no invalidation problem: an
# edition that changes is a different object at a different address, and the
# reader's browser re-verifies the digest on arrival regardless of who served
# it. This is what makes the corpus free to grow — the five hundredth work
# costs one manifest line and one upload.
[[headers]]
  for = "/content/works/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "application/json"

# The manifest is the one mutable pointer in the data plane, so it is the one
# thing that must be revalidated — the same reasoning as index.html naming the
# hashed chunks.
[[headers]]
  for = "/content/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/json"
