# Netlify Configuration for R.I.S.E.
# Recursive Installation of Symbolic Experience

[build]
  # Build command
  command = "npm run build"

  # Output directory (Vite default)
  publish = "dist"

# SPA routing - redirect all requests to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # CSP: self-hosted scripts only; APIs limited to the content providers the app
    # actually calls (Gutenberg, arXiv, Wikimedia Commons, Met, Art Institute, corsproxy).
    # img-src allows any https CDN because museum APIs return varied image hosts.
    #
    # script-src stays 'self': transformers.js would otherwise pull its
    # ONNX runtime from cdn.jsdelivr.net at load time, which is a third-
    # party CDN executing code. The runtime ships inside the package, so
    # it is served from public/ort/ instead and the policy holds.
    # 'wasm-unsafe-eval' is required to COMPILE that WebAssembly; it does
    # not permit eval() or inline script.
    #
    # The two Hugging Face hosts are the Kokoro voice (RECITATION-SPEC).
    # BOTH are required and neither is redundant: huggingface.co serves
    # config.json and tokenizer.json, then redirects the weights and the
    # voice data to us.aws.cdn.hf.co. Allowing only the first fixes the
    # config fetch and then fails on the model — verified by following
    # the redirects rather than assumed.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self' https://www.gutenberg.org https://corsproxy.io https://export.arxiv.org https://commons.wikimedia.org https://upload.wikimedia.org https://api.artic.edu https://www.artic.edu https://collectionapi.metmuseum.org https://openaccess-api.clevelandart.org https://id.rijksmuseum.nl https://huggingface.co https://us.aws.cdn.hf.co; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"

# The shell must never be cached: it names the hashed chunks, so a
# stale index.html sends a browser after files the current deploy has
# replaced. That is what strands a tab left open across a release — it
# asks for Portal-<old hash>.js, gets a 404, and can no longer reach
# any view it had not already loaded. (The router now detects this and
# reloads once to recover; this header keeps the recovery from looping.)
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Cache static assets aggressively — safe because they are content-hashed
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache fonts
[[headers]]
  for = "*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
