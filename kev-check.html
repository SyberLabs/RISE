<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <title>EnterpRise — Kev device check</title>
  <style>
    :root { color-scheme: light dark; --ink: #1c1915; --muted: #5e584f; --bg: #f6f3ec; --panel: #fffdf8; --line: #ddd6c8; }
    @media (prefers-color-scheme: dark) {
      :root { --ink: #ece6da; --muted: #b3aa99; --bg: #151311; --panel: #1f1c19; --line: #3b362f; }
    }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 ui-sans-serif, system-ui, sans-serif; }
    main { max-width: 48rem; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
    h1 { font-size: 1.2rem; margin: 0 0 0.5rem; }
    p { color: var(--muted); margin: 0 0 1rem; }
    .row { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin-bottom: 0.75rem; }
    button, select { font: inherit; color: inherit; min-height: 2.5rem; padding: 0.4rem 0.8rem; border-radius: 0.4rem; border: 1px solid var(--line); background: var(--panel); }
    button:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid #8c3a2f; outline-offset: 2px; }
    #status { color: var(--ink); min-height: 1.5em; }
    textarea { width: 100%; height: 22rem; box-sizing: border-box; font: 0.8rem/1.4 ui-monospace, monospace; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 0.4rem; padding: 0.6rem; }
  </style>
</head>
<body>
  <main>
    <h1>Kev device check</h1>
    <p>Loads Kev on this device’s GPU through WebGPU, then times 30 fixed rail questions and compares each answer with the server decider and the local rules. The first run downloads the model; later runs reuse the browser cache.</p>
    <div class="row">
      <label for="model">Model</label>
      <select id="model"></select>
      <button type="button" id="run">Run check</button>
      <button type="button" id="download">Download JSON</button>
    </div>
    <p id="status" role="status" aria-live="polite">Ready.</p>
    <textarea id="out" readonly aria-label="Check results"></textarea>
  </main>
  <script type="module" src="/src/enterprise/kev-check.js"></script>
</body>
</html>
