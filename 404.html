<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#07070a">
  <title>RISE has moved</title>
  <style>
    :root{color-scheme:dark;--bg:#07070a;--fg:#f2efe8;--muted:#9b98a3;--line:#27272d}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg)}
    body{min-height:100vh;display:grid;place-items:center;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;padding:28px}
    main{width:min(760px,100%);border-top:1px solid var(--line);padding-top:28px}
    .eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:64px}
    h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:clamp(54px,10vw,112px);line-height:.9;letter-spacing:-.055em;margin:0 0 34px}
    p{max-width:580px;font-size:16px;line-height:1.65;color:var(--muted);margin:0 0 34px}
    a{display:inline-block;color:var(--fg);text-decoration:none;border-bottom:1px solid var(--fg);padding-bottom:5px;letter-spacing:.04em}
    .foot{margin-top:92px;padding-top:18px;border-top:1px solid var(--line);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#6f6d78}
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">RISE · Legacy address</div>
    <h1>New<br>coordinates.</h1>
    <p>RISE has moved from <strong>rise.syberlabs.space</strong> to <strong>rise.syberlabs.io</strong>.</p>
    <a href="https://rise.syberlabs.io/">ENTER RISE →</a>
    <div class="foot">Continue · rise.syberlabs.io</div>
  </main>
</body>
</html>
