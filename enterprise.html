<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <title>EnterpRise — live room</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f3ec;
      --panel: #fffdf8;
      --ink: #1c1915;
      --muted: #5e584f;
      --faded: #7d766b;
      --line: #ddd6c8;
      --mark: #8c3a2f;
      --live: #2f6b3a;
      --warn: #8a5a00;
      --err: #a1261b;
      --on-ink: #fffdf8;
      --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      --serif: "Iowan Old Style", Palatino, Georgia, serif;
      --slot: 11.5rem;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #151311;
        --panel: #1f1c19;
        --ink: #ece6da;
        --muted: #b3aa99;
        --faded: #8a8274;
        --line: #3b362f;
        --mark: #e48a78;
        --live: #86c98f;
        --warn: #e4b765;
        --err: #f19386;
        --on-ink: #151311;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.45 var(--sans);
    }
    h1, h2 { margin: 0; }
    h1 { font: 600 1.05rem/1.2 var(--sans); letter-spacing: -0.01em; }
    h2 {
      font: 600 0.75rem/1.3 var(--sans);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.45rem;
    }
    button, select, input { font: inherit; color: inherit; }
    button, select {
      min-height: 2.5rem;
      padding: 0.4rem 0.8rem;
      border-radius: 0.4rem;
      border: 1px solid var(--line);
      background: var(--panel);
    }
    button { cursor: pointer; }
    button.primary, [data-action="promote"] {
      background: var(--ink);
      border-color: var(--ink);
      color: var(--on-ink);
    }
    button:disabled { opacity: 0.5; cursor: default; }
    :focus-visible { outline: 3px solid var(--mark); outline-offset: 2px; }
    kbd {
      font: 600 0.75rem/1 var(--sans);
      border: 1px solid var(--line);
      border-bottom-width: 2px;
      border-radius: 0.25rem;
      padding: 0.1rem 0.3rem;
      background: var(--panel);
    }

    .top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem 0.75rem;
      padding: 0.75rem 1rem 0.5rem;
      max-width: 72rem;
      margin: 0 auto;
    }
    .top h1 { margin-right: auto; }
    #listen { min-width: 9.5rem; }
    #listen[aria-pressed="true"] { background: var(--mark); border-color: var(--mark); color: var(--on-ink); }
    .badge {
      font-size: 0.75rem;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 1rem;
      padding: 0.15rem 0.55rem;
      white-space: nowrap;
      min-width: 8.5rem;
      text-align: center;
    }
    .badge:empty { visibility: hidden; }

    /* One status surface. Fixed height: changing text never moves anything. */
    #state {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      height: 3.25rem;
      padding: 0 1rem;
      background: var(--panel);
      border-block: 1px solid var(--line);
    }
    #state-inner { display: flex; align-items: center; gap: 0.6rem; width: 100%; max-width: 70rem; margin: 0 auto; }
    #state .dot {
      flex: none;
      width: 0.65rem;
      height: 0.65rem;
      border-radius: 50%;
      background: var(--faded);
    }
    #state[data-state="listening"] .dot, #state[data-state="hearing"] .dot, #state[data-state="ready"] .dot { background: var(--live); }
    #state[data-state="hearing"] .dot { animation: pulse 1s ease-in-out infinite; }
    #state[data-state="deciding"] .dot { background: var(--warn); animation: pulse 0.6s ease-in-out infinite; }
    #state[data-state="held"] .dot { background: var(--warn); }
    #state[data-state="loading"] .dot { background: var(--warn); animation: pulse 1.4s ease-in-out infinite; }
    #state[data-state="error"] .dot { background: var(--err); }
    /* A fixed number of lines per viewport, so a longer message never moves anything. */
    #state-text {
      flex: 1;
      min-width: 0;
      height: 1.3em;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: 0.95rem;
      line-height: 1.3;
    }
    #last-decision {
      flex: none;
      font: 0.8rem/1 var(--sans);
      font-variant-numeric: tabular-nums;
      color: var(--muted);
      min-width: 6.5rem;
      text-align: right;
    }
    @keyframes pulse { 50% { opacity: 0.3; } }
    @media (prefers-reduced-motion: reduce) {
      #state .dot { animation: none !important; }
    }

    main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      grid-template-areas: "left right" "trace trace";
      align-items: start;
      gap: 1.25rem 1.5rem;
      max-width: 72rem;
      margin: 0 auto;
      padding: 1rem 1rem 3rem;
    }
    .col { display: grid; gap: 1.25rem; min-width: 0; }
    .col.left { grid-area: left; }
    .col.right { grid-area: right; }
    #trace { grid-area: trace; }

    /* Transcript: fixed height, scrolls inside itself. */
    .scroller { position: relative; }
    #transcript {
      list-style: none;
      margin: 0;
      padding: 0.5rem 0.75rem;
      height: 22rem;
      overflow-y: auto;
      overscroll-behavior: contain;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 0.5rem;
    }
    #transcript li { padding: 0.3rem 0; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
    #transcript li:last-child { border-bottom: 0; }
    #transcript li[data-window="out"] .text { color: var(--faded); }
    #transcript li[data-final="false"] .text { color: var(--muted); font-style: italic; }
    #transcript .who {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--mark);
      margin-right: 0.35rem;
    }
    #transcript .note {
      display: block;
      min-height: 1.2rem;
      font-size: 0.8rem;
      line-height: 1.2rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #transcript-hint { color: var(--muted); margin: 0.25rem 0; }
    #transcript-hint.overlay { position: absolute; top: 0.6rem; left: 0.85rem; right: 0.85rem; margin: 0; pointer-events: none; }
    #new-lines {
      position: absolute;
      left: 50%;
      bottom: 0.6rem;
      transform: translateX(-50%);
      min-height: 2rem;
      padding: 0.2rem 0.8rem;
      border-radius: 1rem;
      background: var(--ink);
      border-color: var(--ink);
      color: var(--on-ink);
      font-size: 0.85rem;
    }
    #new-lines[hidden] { display: none; }

    #ask-form { display: flex; gap: 0.5rem; margin-top: 0.75rem; align-items: center; }
    #ask-form label { font-weight: 600; font-size: 0.9rem; }
    #ask {
      flex: 1;
      min-width: 0;
      min-height: 2.5rem;
      padding: 0.4rem 0.7rem;
      border: 1px solid var(--line);
      border-radius: 0.4rem;
      background: var(--panel);
    }
    #ask-answer {
      height: 1.4rem;
      margin: 0.35rem 0 0;
      font-size: 0.9rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Rail: fixed slots, fixed height. A card never moves another card. */
    /* Reserved before the script paints the slots. */
    #rail { min-height: calc(3 * var(--slot) + 1.2rem); }
    #rail ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.6rem; }
    #rail .slot {
      position: relative;
      height: var(--slot);
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border: 1px solid var(--line);
      border-left: 4px solid var(--mark);
      border-radius: 0.4rem;
      padding: 0.55rem 0.75rem 0.6rem;
      overflow: hidden;
    }
    #rail .slot.empty { border: 1px dashed var(--line); background: transparent; }
    #rail .slot[data-target] { box-shadow: 0 0 0 2px var(--mark); }
    .card-tags { position: absolute; top: 0.45rem; right: 0.7rem; display: flex; gap: 0.5rem; margin: 0; }
    .card-body .card-title { padding-right: 6.5rem; }
    .tag {
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .tag.on { color: var(--live); }
    .tag.key { display: none; color: var(--mark); }
    [data-target] .tag.key { display: inline; }
    .card-body { flex: 1; min-height: 0; overflow-y: auto; }
    .card-title { font: 600 1rem/1.25 var(--serif); margin: 0 0 0.25rem; }
    .card-quote { font: 0.95rem/1.35 var(--serif); margin: 0 0 0.3rem; }
    .card-source { font-size: 0.75rem; color: var(--muted); margin: 0; }
    .card-chart { border-collapse: collapse; font-size: 0.85rem; margin: 0 0 0.25rem; width: 100%; }
    .card-chart th { text-align: left; font-weight: 500; padding: 0.05rem 0.5rem 0.05rem 0; width: 2.5rem; }
    .card-chart td { padding: 0.05rem 0; font-variant-numeric: tabular-nums; }
    .card-chart .bar { display: inline-block; height: 0.55rem; min-width: 2px; margin-right: 0.4rem; background: var(--mark); vertical-align: middle; }
    .card-actions { display: flex; gap: 0.5rem; padding-top: 0.45rem; }

    #stage { min-height: 1.5rem; }
    #stage [data-surface="stage"] { display: grid; gap: 0.6rem; }
    #stage article {
      background: var(--panel);
      border: 1px solid var(--line);
      border-top: 4px solid var(--ink);
      border-radius: 0.4rem;
      padding: 0.75rem;
      overflow-wrap: anywhere;
    }
    #stage .card-title { font-size: 1.2rem; }
    #stage .card-quote { font-size: 1.05rem; }
    #stage [data-action="retract"] { margin-top: 0.5rem; }
    .empty-note { color: var(--muted); margin: 0; }

    #debrief { margin: 0; padding-left: 1.1rem; color: var(--ink); }
    #debrief:not(:has(li)) { padding-left: 0; color: var(--muted); }
    #trace { border-top: 1px solid var(--line); padding-top: 0.75rem; color: var(--muted); font-size: 0.9rem; }
    #trace summary { cursor: pointer; font-weight: 600; min-height: 2rem; }
    #trace p { margin: 0.4rem 0; }
    #keys { margin: 0.6rem 0 0; font-size: 0.8rem; color: var(--muted); }
    #keys kbd { margin-right: 0.2rem; }

    /* The stage window (projector.js): read from across the room. */
    [data-view="projector"] body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 4vh 5vw;
    }
    [data-view="projector"] #stage { width: min(100%, 90rem); }
    [data-view="projector"] #stage article { padding: 2.5vh 3vw; border-top-width: 0.5rem; }
    [data-view="projector"] #stage .card-title { font-size: clamp(1.8rem, 4vw, 4rem); margin-bottom: 0.4em; }
    [data-view="projector"] #stage .card-quote { font-size: clamp(1.4rem, 3vw, 3rem); }
    [data-view="projector"] #stage .card-source { font-size: clamp(1rem, 1.5vw, 1.5rem); }
    [data-view="projector"] #stage .card-chart { font-size: clamp(1.2rem, 2.2vw, 2.2rem); }
    [data-view="projector"] #stage .card-chart th { width: 4em; }
    [data-view="projector"] #stage .card-chart .bar { height: 0.7em; }

    @media (max-width: 760px) {
      /* One column: follow-up sits below the stage so its growth moves nothing live. */
      #stage-window { display: none; }
      main {
        grid-template-columns: minmax(0, 1fr);
        grid-template-areas: "heard" "rail" "stage" "follow" "trace";
      }
      .col { display: contents; }
      #heard { grid-area: heard; }
      #rail-panel { grid-area: rail; }
      #stage-panel { grid-area: stage; }
      #follow-panel { grid-area: follow; }
      #transcript { height: 12rem; }
      #keys, #listen .wide { display: none; }
      .top {
        display: grid;
        grid-template-columns: 5.25rem minmax(0, 1fr) minmax(0, 1fr);
        padding: 0.6rem 0.75rem 0.5rem;
      }
      .top h1 { grid-row: 1; grid-column: 1 / 3; align-self: center; }
      .badge { grid-row: 1; grid-column: 3; justify-self: end; min-width: 0; }
      #listen { grid-row: 2; grid-column: 1; min-width: 0; padding-inline: 0.5rem; }
      .top select { min-width: 0; padding-inline: 0.45rem; font-size: 0.9rem; }
      #state { height: 3.6rem; padding: 0 0.75rem; }
      #state-inner { align-items: flex-start; }
      #state .dot { margin-top: 0.35em; }
      #state-text {
        height: 2.6em;
        white-space: normal;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
      }
      #last-decision { min-width: 5.5rem; padding-top: 0.2em; }
      main { padding: 0.75rem 0.75rem 3rem; }
    }
  </style>
</head>
<body>
  <header class="top">
    <h1>Speaker rail</h1>
    <button type="button" id="listen" class="primary" aria-pressed="false">Listen</button>
    <span class="badge" id="speech-badge"></span>
    <select id="speaker" aria-label="Speaker">
      <option value="presenter">Presenter</option>
      <option value="audience">Audience</option>
    </select>
    <select id="decider" aria-label="Decides">
      <option value="local" selected>Local rules</option>
      <option value="device">Kev (device)</option>
      <option value="jev">JEV</option>
    </select>
    <button type="button" id="stage-window">Stage window</button>
  </header>
  <div id="state" data-state="idle">
    <div id="state-inner">
      <span class="dot" aria-hidden="true"></span>
      <span id="state-text" role="status" aria-live="polite"></span>
      <span id="last-decision" aria-label="Last decision time"></span>
    </div>
  </div>
  <main>
    <div class="col left">
      <section id="heard" aria-labelledby="heard-h">
        <h2 id="heard-h">Heard</h2>
        <div id="transcript-panel" class="scroller">
          <ol id="transcript" tabindex="0" aria-label="Transcript"></ol>
          <button type="button" id="new-lines" hidden>↓ New lines</button>
        </div>
        <form id="ask-form" autocomplete="off">
          <label for="ask">Ask</label>
          <input id="ask" type="text" enterkeyhint="search" spellcheck="false">
        </form>
        <p id="ask-answer" aria-live="polite"></p>
        <p id="keys"><span id="key-listen"><kbd>L</kbd>listen · <kbd>Q</kbd>hold while the audience speaks · </span><kbd>P</kbd>promote marked · <kbd>D</kbd>dismiss marked · <kbd>R</kbd>retract · <kbd>/</kbd>ask</p>
      </section>
      <section id="follow-panel" aria-labelledby="follow-h">
        <h2 id="follow-h">Follow-up</h2>
        <ul id="debrief">No unanswered questions yet.</ul>
      </section>
    </div>
    <div class="col right">
      <section id="rail-panel" aria-labelledby="rail-h">
        <h2 id="rail-h">Rail</h2>
        <div id="rail"></div>
      </section>
      <section id="stage-panel" aria-labelledby="stage-h">
        <h2 id="stage-h">Stage</h2>
        <div id="stage"></div>
      </section>
    </div>
    <details id="trace">
      <summary>Trace</summary>
      <p id="metrics"></p>
      <p id="trace-summary"></p>
      <button type="button" id="export-trace">Export trace</button>
    </details>
  </main>
  <script type="module" src="/src/enterprise/demo-page.js"></script>
</body>
</html>
