name: RISE API

on:
  pull_request:
    paths:
      - 'services/rise-api/**'
      - '.github/workflows/rise-api.yml'
  push:
    branches: [main]
    paths:
      - 'services/rise-api/**'
      - '.github/workflows/rise-api.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: rise_test
          POSTGRES_USER: rise_test
          POSTGRES_PASSWORD: rise_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rise_test -d rise_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      RISE_TEST_DATABASE_URL: postgres://rise_test:rise_test@localhost:5432/rise_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: services/rise-api/go.sum
      - name: Test with PostgreSQL and race detector
        working-directory: services/rise-api
        run: go test -race ./...
      - name: Vet and build
        working-directory: services/rise-api
        run: |
          go vet ./...
          go build -trimpath ./cmd/rise-api
      - name: Check Go vulnerability reachability
        working-directory: services/rise-api
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Build non-root container
        run: docker build -f services/rise-api/Dockerfile services/rise-api
