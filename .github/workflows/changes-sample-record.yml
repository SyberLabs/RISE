# Recordings of the dry-run sample digests, on this branch only (delete before merging, with
# .github/changes-sample/). Each digest is read from the log of the sample run that wrote it, played in a
# local RISE build through Chromium with the paced voice, recorded, and narrated with a local Piper voice.
# No model is called and no secret is used. The last job keeps the mp4s on a ref outside the branches,
# refs/changes-samples/f5b56b, so they can be fetched with git; nothing is published.
name: Changes sample recordings

on:
  push:
    branches: [claude/project-thread-f5b56b]
    paths: [.github/workflows/changes-sample-record.yml, .github/changes-sample/**]

env:
  SAMPLE_RUN: '40655819013'

jobs:
  record:
    name: Record the ${{ matrix.slug }} sample
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { slug: windmill, repo: windmill-labs/windmill }
          - { slug: hatchet, repo: hatchet-dev/hatchet }
          - { slug: openspec, repo: Fission-AI/OpenSpec }
          - { slug: openstatus, repo: openstatusHQ/openstatus }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.3
          cache: npm

      - name: Read the digest from the sample run's log
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ matrix.repo }}
        run: |
          for a in 1 2 3; do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SAMPLE_RUN/attempts/$a/jobs?per_page=100" \
              --jq '.jobs[]|[.id,.name,.conclusion]|@tsv' >> jobs.tsv 2>/dev/null || true
          done
          job=$(awk -F'\t' -v n="Write a dry-run digest of $REPO" '$2==n && $3=="success" {print $1}' jobs.tsv | tail -1)
          if [ -z "$job" ]; then echo "No successful sample of $REPO"; exit 1; fi
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -o job.log "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/jobs/$job/logs"
          node .github/changes-sample/from-log.mjs job.log "$RUNNER_TEMP/digest"
          ls -la "$RUNNER_TEMP/digest"

      - name: Install locked dependencies, Chromium, ffmpeg and a Piper voice
        run: |
          npm ci
          npx playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends ffmpeg
          python3 -m pip install --user piper-tts==1.3.0
          mkdir -p "$RUNNER_TEMP/voice" && cd "$RUNNER_TEMP/voice" && python3 -m piper.download_voices en_US-lessac-medium

      - name: Build RISE with this sample's repository admitted, on the runner only
        run: |
          sed -i 's/const problems = digestProblems(value);/const problems = digestProblems(value, globalThis.__RISE_SAMPLE_REPO);/' src/app/changes.js
          grep -q __RISE_SAMPLE_REPO src/app/changes.js
          VITE_RISE_ARCHIVE_REVIEW=1 npx vite build

      - name: Record the reading
        env:
          REPO: ${{ matrix.repo }}
        run: |
          npx vite preview --host 127.0.0.1 --port 4318 --strictPort &
          for i in $(seq 60); do curl -sf -o /dev/null http://127.0.0.1:4318/ && break; sleep 1; done
          digest=$(ls "$RUNNER_TEMP"/digest/20*.json | head -1)
          node .github/changes-sample/record.mjs "$digest" "$REPO" "$RUNNER_TEMP/out"

      - name: Narrate and encode the mp4
        env:
          SLUG: ${{ matrix.slug }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          python3 .github/changes-sample/narrate.py "$RUNNER_TEMP/out" "$RUNNER_TEMP/voice/en_US-lessac-medium.onnx"
          mkdir -p "$RUNNER_TEMP/keep/$SLUG"
          cp "$RUNNER_TEMP/out/sample.mp4" "$RUNNER_TEMP/keep/$SLUG/$SLUG-changes-sample.mp4"
          cp "$RUNNER_TEMP/out/timing.json" "$RUNNER_TEMP/out/last.png" "$RUNNER_TEMP/keep/$SLUG/"
          cp "$RUNNER_TEMP"/digest/*.json "$RUNNER_TEMP/keep/$SLUG/"
          ls -la "$RUNNER_TEMP/keep/$SLUG"
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 "$RUNNER_TEMP/keep/$SLUG/$SLUG-changes-sample.mp4"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sample-${{ matrix.slug }}
          path: ${{ runner.temp }}/keep
          retention-days: 3

  keep:
    name: Keep the recordings on a ref outside the branches
    needs: record
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sample-*
          merge-multiple: true
          path: samples
      - name: Push them to refs/changes-samples/f5b56b
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -R samples
          cd samples
          git init -q && git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Changes sample recordings from run $GITHUB_RUN_ID"
          git push -f "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" HEAD:refs/changes-samples/f5b56b
