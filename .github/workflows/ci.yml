# CI: fast pull-request checks; complete browser coverage on main and dispatch.
# Jobs are separate so a red run names which promise broke.
#
# A change that is only prose skips every job only code can break, and finishes
# in under a minute. `CI` is the one job that always reports, and the only name
# a branch ruleset should require.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push supersedes the first — on a pull request. A cancelled run on
# main is a commit whose health was never recorded, so main's runs finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Nothing in CI writes to the repository.
permissions:
  contents: read

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      # Asking the API costs a couple of seconds; cloning enough history to
      # diff against the base costs far more than the jobs this can skip.
      - name: Prose alone cannot break the application
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Only a pull request can be narrowed. A push to main and a manual
          # dispatch always run everything.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo 'code=true' >> "$GITHUB_OUTPUT"
            echo 'Not a pull request — running every job.'
            exit 0
          fi

          # A failed call must not block a merge, so it falls through to the
          # empty case below rather than killing the job under `set -e`.
          changed=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename' || true)

          # Fail safe: no answer means we do not know, and not knowing runs
          # everything. Silence must never be read as "nothing to test".
          if [ -z "$changed" ]; then
            echo 'code=true' >> "$GITHUB_OUTPUT"
            echo 'No file list came back — running every job.'
            exit 0
          fi

          # Everything outside this allowlist is treated as code, so a path
          # nobody anticipated errs toward running the suite.
          code=$(printf '%s\n' "$changed" \
            | grep -Ev '^(docs/|\.agents/|\.cursor/|[^/]+\.md$|LICENSE$|NOTICE$)' \
            || true)

          if [ -n "$code" ]; then
            echo 'code=true' >> "$GITHUB_OUTPUT"
            echo 'Code changed:'
            printf '%s\n' "$code" | sed 's/^/  /'
          else
            echo 'code=false' >> "$GITHUB_OUTPUT"
            echo 'Prose only — skipping unit tests, build, Scriptorium, and browser smoke.'
            printf '%s\n' "$changed" | sed 's/^/  /'
          fi

  # ── Always runs ─────────────────────────────────────────────────────
  #
  # ci-hygiene.mjs reads README.md and NOTICE, and the system design document
  # can be edited by hand, so a prose-only change still has these to answer to.

  hygiene:
    name: Source hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: No secret may travel in a delivery URL
        run: node scripts/ci-hygiene.mjs

      # Build and test tools execute repository-controlled inputs with the CI
      # token's read authority, so their known high-severity flaws are part of
      # the release boundary even when their bytes do not ship to readers.
      - name: No dependency may carry a known high-severity advisory
        run: npm run security:audit

      - name: The voice authoring image adapter remains compatible
        run: npm run security:compat

  docs:
    name: System design document
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # src/core/system-design.test.js guards ARCHITECTURE.md, and it lives in
      # the unit suite — which a prose-only change skips. Editing that document
      # is exactly when its guard has to run, so it runs here too.
      - name: The system design document does not lie
        run: npx vitest run src/core/system-design.test.js

      # §3's import graph is written by the code it describes, so the only way
      # it can be wrong is if someone forgot to run the generator.
      - name: The architecture diagram agrees with the source
        run: |
          npm run docs:diagram
          if ! git diff --exit-code -- docs/specs/ARCHITECTURE.md; then
            echo ''
            echo 'The committed diagram is not what src/ generates.'
            echo 'Run: npm run docs:diagram — then commit the result.'
            exit 1
          fi

  # ── Runs when code changed ──────────────────────────────────────────

  test:
    name: Unit tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        if: github.event_name != 'pull_request'
        with:
          ffmpeg: 'true'
          chromium: 'true'
      - uses: ./.github/actions/setup
        if: github.event_name == 'pull_request'
      - name: Core unit smoke
        if: github.event_name == 'pull_request'
        run: >-
          npm run test:run --
          src/core/content-store.test.js
          src/core/journey-session.test.js
          src/audio/engine.lifecycle.test.js
          src/content/keystones.test.js
      - name: Full unit and integration suite
        if: github.event_name != 'pull_request'
        run: npm run test:run

  build:
    name: Production build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run build
      # A first load can only stay small if something refuses to let it grow.
      # The build itself already fails on a deferral the bundler ignores;
      # this fails on the byte count that deferral was for.
      - name: The Portal's cost is a budget, not an aspiration
        run: npm run measure:first-load

  scriptorium:
    name: Scriptorium CLI
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # The unit suite drives the CLI's argv shell in-process. This spawns it:
      # `npm run scriptorium` must resolve, vite-node must load a graph that
      # imports division-index.json, and a refusal code must arrive at the
      # shell as the exit status the spec documents (§13). Its own job so a red
      # run names which of those broke.
      - name: A refusal is an exit status
        run: npm run scriptorium:ci

  # Browser tests require a production build, Chromium installation, and
  # serial audio flows. Run the corridor on main and on manual dispatch.
  e2e:
    name: Browser gate
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          chromium: 'true'
      # playwright.config.js builds and previews on its own — what ships
      # is what gets tested.
      - run: npm run test:e2e:gate
      - uses: actions/upload-artifact@v4
        if: failure() || cancelled()
        with:
          name: playwright-report-gate
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Keep the four check names until the repository ruleset is changed. On a
  # pull request each reports immediately and explicitly says browser coverage
  # is deferred. On main and manual dispatch all four run the complete suite.
  e2e-full:
    name: Browser matrix ${{ matrix.shard }}/4
    needs: changes
    # Do not skip this job. A skipped matrix reports the unexpanded name
    # "Browser matrix ${{ matrix.shard }}/4", and a ruleset that requires
    # "Browser matrix 1/4" then waits forever. The shards always start;
    # Playwright runs only after merge or on manual dispatch.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # A failing shard must not hide the state of the other three.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Report browser coverage policy
        if: github.event_name == 'pull_request'
        run: echo 'Browser matrix deferred to main; this pull request did not run browser tests.'
      - uses: actions/checkout@v4
        if: github.event_name != 'pull_request'
      - uses: ./.github/actions/setup
        if: github.event_name != 'pull_request'
        with:
          chromium: 'true'
      - if: github.event_name != 'pull_request'
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: (failure() || cancelled()) && github.event_name != 'pull_request'
        with:
          # upload-artifact@v4 rejects a name a sibling already used.
          name: playwright-report-full-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ── The gate ────────────────────────────────────────────────────────

  ci:
    name: CI
    # Every other job can be skipped. This one cannot, because a required check
    # that never reports blocks a merge forever.
    if: always()
    needs: [changes, hygiene, docs, test, build, scriptorium, e2e, e2e-full]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Skipped is allowed — skipping is what the change filter is for. Failed
      # and cancelled are not.
      - name: Every job that ran, passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s\n' "$RESULTS" | jq -r 'to_entries[] | "  \(.value.result)\t\(.key)"'
          broken=$(printf '%s\n' "$RESULTS" \
            | jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key')
          if [ -n "$broken" ]; then
            echo ''
            echo 'Did not pass:'
            printf '%s\n' "$broken" | sed 's/^/  /'
            exit 1
          fi
