# The tests run whether or not anyone remembers to run them.
#
# 1,679 tests and a clean build existed only because someone typed the
# command. The session that added this workflow is the argument for it: a
# 128ms drift in one of 101 pinned Atrium durations was caught by a test
# that had no way to run on its own, and the fix that caused the drift
# was in a file nobody would have thought to connect to it.
#
# Four jobs, and they are separate on purpose — a red build should say
# WHICH promise broke without anyone opening a log.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push supersedes the first. The suite is slow enough that
# queueing every intermediate commit would mean reading stale results.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Matches the engines field in package.json.
          node-version: '20.19'
          cache: npm
      - run: npm ci
      - run: npm run test:run

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19'
          cache: npm
      - run: npm ci
      - run: npm run build

  hygiene:
    name: Source hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19'
          cache: npm
      - run: npm ci
      - name: No secret may travel in a delivery URL
        run: node scripts/ci-hygiene.mjs

  e2e:
    name: Browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19'
          cache: npm
      - run: npm ci
      # Only Chromium. The suite runs one worker against one audio
      # device by design; a browser matrix would not be testing more.
      - run: npx playwright install --with-deps chromium
      # playwright.config.js builds and previews on its own — what ships
      # is what gets tested.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
