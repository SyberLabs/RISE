name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          chromium: 'true'
          audio: 'true'
      - name: Fast release checks
        run: |
          set -euo pipefail
          node scripts/ci-hygiene.mjs
          npm run roadmap:check
          npm run test:roadmap
          node --test scripts/decision-eval.test.mjs scripts/arena/arena.test.mjs scripts/arena/arena-file.test.mjs scripts/arena/calibration.test.mjs local/bridge.test.mjs local/hardware.test.mjs local/launcher.test.mjs
          python3 -m unittest discover -s deploy/kev -p 'test_*.py'
          npm run security:audit &
          audit=$!
          npm run security:compat
          npm run docs:diagram
          git diff --exit-code -- docs/specs/ARCHITECTURE.md
          npm run content:build
          # The list and the number of files it must collect live in vitest.fast.config.js.
          npx vitest run --config vitest.fast.config.js \
            --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/fast-tests.json" &
          tests=$!
          npx vite build
          npm run measure:first-load
          # The Worker is bundled by wrangler, not Vite: an import the validator reaches that
          # Vite accepts (a stylesheet, a font) fails only at deploy. #518 broke every deploy
          # of main for four merges this way; the dry run fails the pull request instead.
          ./node_modules/.bin/wrangler deploy --config wrangler.production.jsonc --dry-run --outdir "$RUNNER_TEMP/worker-bundle"
          # Attest the private provider wrapper/config before root deploys the key-holding preview.
          ./node_modules/.bin/wrangler deploy --config wrangler.plus-preview.jsonc --dry-run --outdir "$RUNNER_TEMP/voice-provider-bundle"
          wait "$tests"
          # shellcheck disable=SC2016 # JavaScript, not shell, expands ${...} here.
          FAST_TESTS_REPORT="$RUNNER_TEMP/fast-tests.json" node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { FAST_TEST_FILES } from "./vitest.fast.config.js";
            const ran = JSON.parse(readFileSync(process.env.FAST_TESTS_REPORT, "utf8")).testResults.length;
            if (ran !== FAST_TEST_FILES) {
              console.error(`The fast unit tests collected ${ran} files; vitest.fast.config.js expects ${FAST_TEST_FILES}.`);
              process.exit(1);
            }'
          wait "$audit"
      # The release is the dist/ built and measured above and the Worker bundle the
      # dry run produced, both from this commit. The browser gate rebuilds dist/
      # with test flags, so the release is moved aside before it runs. Production
      # deploys this artifact and only after this whole job, gate included, passes.
      - name: Stage the tested release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TESTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$TESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(find dist/audio/recitation -type f -name '*.opus' | wc -l)" -eq 877
          printf '%s\n' "$TESTED_SHA" > "dist/release-$TESTED_SHA.txt"
          printf '%s\n' "$TESTED_SHA" > dist/release.txt
          mkdir -p "$RUNNER_TEMP/release/worker"
          mv dist "$RUNNER_TEMP/release/dist"
          cp "$RUNNER_TEMP/worker-bundle/index.js" "$RUNNER_TEMP/release/worker/index.js"
          cp -r "$RUNNER_TEMP/voice-provider-bundle" "$RUNNER_TEMP/release/voice-provider"
          cp wrangler.plus-preview.jsonc "$RUNNER_TEMP/release/voice-provider/wrangler.plus-preview.jsonc"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: rise-release-${{ github.sha }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 1
          retention-days: 14
      # Layout, hit-testing and the reading path only show in a browser: #373
      # merged a phone star map whose targets covered each other because no
      # required check opened one. The gate is the fast browser subset.
      - name: Browser gate
        run: npm run test:e2e:gate
  # The private voice provider (rise-plus-preview) is its own job: it deploys before production
  # when it can, and its failure is reported but never holds the site (production needs only CI).
  voice-provider:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ci]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
    env:
      TESTED_SHA: ${{ github.sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: rise-release-${{ github.sha }}
          path: ${{ runner.temp }}/release
      - name: Verify the tested provider bundle
        run: |
          set -euo pipefail
          ./node_modules/.bin/wrangler deploy --config wrangler.plus-preview.jsonc --dry-run --outdir "$RUNNER_TEMP/provider-deploy-bundle"
          cmp "$RUNNER_TEMP/release/voice-provider/plus-preview.js" "$RUNNER_TEMP/provider-deploy-bundle/plus-preview.js"
          cmp "$RUNNER_TEMP/release/voice-provider/wrangler.plus-preview.jsonc" wrangler.plus-preview.jsonc
      - name: Deploy private voice provider
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$TESTED_SHA" = "$current"
          # Retain this Worker's existing encrypted key; public test payments cannot render.
          ./node_modules/.bin/wrangler deploy --config wrangler.plus-preview.jsonc --message "RISE private voice provider $TESTED_SHA" | tee "$RUNNER_TEMP/provider-deploy.log"
          version=$(sed -n 's/^Current Version ID: *//p' "$RUNNER_TEMP/provider-deploy.log")
          echo "Deployed private voice provider version: \`${version:-unknown}\` (RISE $TESTED_SHA)" >> "$GITHUB_STEP_SUMMARY"

  production:
    # Waits for the provider's attempt so it goes first when it can, and deploys whether it passed or not.
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.ci.result == 'success'
    # Deploy only what the CI job above built and tested on this push.
    needs: [ci, voice-provider]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # GitHub restricts this environment to main. Required PR checks gate merges.
    environment:
      name: production
      url: https://rise.syberlabs.io
    env:
      TESTED_SHA: ${{ github.sha }}
      # The Worker runs no model and holds no model credential; readers bring their
      # own OpenRouter account or run Kev locally.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # The checkout supplies wrangler, its config and the Worker source it bundles;
      # nothing here builds dist/.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: rise-release-${{ github.sha }}
          path: ${{ runner.temp }}/release
      - name: Verify the tested release
        run: |
          set -euo pipefail
          [[ "$TESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test ! -e dist
          mv "$RUNNER_TEMP/release/dist" dist
          test "$(cat dist/release.txt)" = "$TESTED_SHA"
          test "$(cat "dist/release-$TESTED_SHA.txt")" = "$TESTED_SHA"
          test "$(find dist/audio/recitation -type f -name '*.opus' | wc -l)" -eq 877
          # wrangler bundles the Worker again at deploy; it must be byte-identical
          # to the bundle the CI job dry-ran.
          ./node_modules/.bin/wrangler deploy --config wrangler.production.jsonc --dry-run --outdir "$RUNNER_TEMP/deploy-bundle"
          cmp "$RUNNER_TEMP/release/worker/index.js" "$RUNNER_TEMP/deploy-bundle/index.js"
      - name: Note the private voice provider's deploy
        env:
          PROVIDER_RESULT: ${{ needs.voice-provider.result }}
        run: |
          set -euo pipefail
          # The provider deploys first when it can (production's PLUS_VOICE_PROVIDER binding calls it),
          # but its failure never holds the site: only Plus voices depend on it.
          if [ "$PROVIDER_RESULT" != success ]; then
            echo "::warning::The private voice provider did not deploy ($PROVIDER_RESULT); production deploys without it, and Plus voices use the provider version already live."
            echo "Private voice provider: **$PROVIDER_RESULT** (production deployed regardless; Plus voices use the provider version already live)." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Record prior production versions
        run: |
          set -euo pipefail
          ./node_modules/.bin/wrangler versions list --config wrangler.production.jsonc > "$RUNNER_TEMP/prior-versions.txt"
          # shellcheck disable=SC2016 # the backticks are Markdown.
          {
            echo '### Production versions before this deploy'
            echo '```'
            cat "$RUNNER_TEMP/prior-versions.txt"
            echo '```'
            echo 'Roll back with `./node_modules/.bin/wrangler rollback <VERSION_ID> --config wrangler.production.jsonc --message "RISE rollback"`.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy production
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$TESTED_SHA" = "$current"
          ./node_modules/.bin/wrangler deploy --config wrangler.production.jsonc --message "RISE $TESTED_SHA" | tee "$RUNNER_TEMP/deploy.log"
          version=$(sed -n 's/^Current Version ID: *//p' "$RUNNER_TEMP/deploy.log")
          echo "Deployed Worker version: \`${version:-unknown}\` (RISE $TESTED_SHA)" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify public production serves the exact release
        run: |
          set -euo pipefail
          # Cloudflare can serve the prior version for a few seconds after deploy.
          for attempt in {1..45}; do
            status=$(curl -sS --max-time 20 --retry 2 --retry-delay 1 --retry-all-errors \
              -o "$RUNNER_TEMP/public-body" -w '%{http_code}' \
              "https://rise.syberlabs.io/release-$TESTED_SHA.txt" || true)
            if [ "$status" = 200 ] && [ "$(cat "$RUNNER_TEMP/public-body")" = "$TESTED_SHA" ]; then
              break
            fi
            if [ "$attempt" = 45 ]; then
              echo "Production did not serve release $TESTED_SHA after 45 checks."
              exit 1
            fi
            sleep 1
          done
          for path in / /try-rise; do
            status=$(curl -sS --max-time 20 --retry 5 --retry-delay 3 --retry-all-errors \
              -D "$RUNNER_TEMP/public-headers" -o "$RUNNER_TEMP/public-body" \
              -w '%{http_code}' "https://rise.syberlabs.io$path")
            test "$status" = 200 || { echo "Expected public HTTP 200 at $path; got HTTP $status"; exit 1; }
          done
          status=$(curl -sS --max-time 20 --retry 5 --retry-delay 3 --retry-all-errors \
            -D "$RUNNER_TEMP/public-headers" -o "$RUNNER_TEMP/public-body" \
            -w '%{http_code}' 'https://rise.syberlabs.io/api/not-a-route')
          test "$status" = 404 || { echo "Expected JSON 404 for unknown API; got HTTP $status"; exit 1; }
          grep -Eiq '^content-type: application/json' "$RUNNER_TEMP/public-headers"
          jq -e '.error.code == "NOT_FOUND"' "$RUNNER_TEMP/public-body" > /dev/null
          # No release check may spend inference: the catalog is read-only public data,
          # and every retired model route must answer 410 without calling a model.
          # One sighting of the release does not mean every edge serves it: an edge
          # still on the prior release answers this path with the app page (HTTP 200).
          # Retry until the catalog passes its contract, within a bounded window.
          for attempt in {1..20}; do
            status=$(curl -sS --max-time 20 --retry 2 --retry-delay 1 --retry-all-errors \
              -o "$RUNNER_TEMP/catalog-body" -w '%{http_code}' 'https://rise.syberlabs.io/content/catalog.json' || true)
            if [ "$status" = 200 ] && CATALOG_FILE="$RUNNER_TEMP/catalog-body" node --input-type=module -e '
              import { readFileSync } from "node:fs";
              import { readPublicCatalog } from "./src/core/decision/catalog.js";
              let catalog = null;
              try { catalog = JSON.parse(readFileSync(process.env.CATALOG_FILE, "utf8")); } catch { process.exit(1); }
              process.exit(readPublicCatalog(catalog) ? 0 : 1);'; then
              break
            fi
            if [ "$attempt" = 20 ]; then
              echo "The public catalog file did not pass the browser contract; last HTTP $status:"
              head -c 600 "$RUNNER_TEMP/catalog-body"
              exit 1
            fi
            sleep 3
          done
          for path in /api/jev-recommend /api/jev-decision /api/jev/route /api/jev-visual-score /api/enterprise-decision /api/personal-piece; do
            status=$(curl -sS --max-time 20 --retry 3 --retry-delay 2 --retry-all-errors \
              -o "$RUNNER_TEMP/retired-body" -w '%{http_code}' -X POST \
              -H 'Origin: https://rise.syberlabs.io' -H 'Content-Type: application/json' \
              --data '{"intent":"A thoughtful classic about self-examination","schemaVersion":3}' \
              "https://rise.syberlabs.io$path")
            test "$status" = 410 || { echo "Retired route $path answered HTTP $status"; exit 1; }
            jq -e '.error.code == "SHARED_INFERENCE_RETIRED"' "$RUNNER_TEMP/retired-body" > /dev/null
          done
          # A stale edge can answer one request; a later deploy answers every one.
          for attempt in {1..20}; do
            status=$(curl -sS --max-time 20 -o "$RUNNER_TEMP/release-after-checks" \
              -w '%{http_code}' "https://rise.syberlabs.io/release-$TESTED_SHA.txt" || true)
            if [ "$status" = 200 ] && [ "$(cat "$RUNNER_TEMP/release-after-checks")" = "$TESTED_SHA" ]; then
              break
            fi
            if [ "$attempt" = 20 ]; then
              echo "Production changed during the release checks; expected release $TESTED_SHA."
              exit 1
            fi
            sleep 3
          done
          {
            echo "Deployed production artifact $TESTED_SHA; public pages, exact release marker, JSON API 404, public decision catalog, and every retired inference route (410) verified. No model was called."
            echo 'Owner acceptance: connect your own OpenRouter account at https://rise.syberlabs.io/, ask for a reading, and check that Chamber starts with the selected text and settings.'
          } >> "$GITHUB_STEP_SUMMARY"
