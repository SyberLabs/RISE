name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Fast release checks
        run: |
          set -euo pipefail
          node scripts/ci-hygiene.mjs
          npm run security:audit
          npm run security:compat
          npx vitest run src/core/system-design.test.js
          npm run docs:diagram
          git diff --exit-code -- docs/specs/ARCHITECTURE.md
          npm run test:run -- \
            src/core/content-store.test.js \
            src/core/journey-session.test.js \
            src/audio/engine.lifecycle.test.js \
            src/content/keystones.test.js
          npm run build
          npm run measure:first-load
      - name: Pack the tested release
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          TESTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$TESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          printf '%s\n' "$TESTED_SHA" > "dist/release-$TESTED_SHA.txt"
          tar -czf "$RUNNER_TEMP/release.tar.gz" \
            dist \
            worker/index.mjs \
            netlify/functions/jev-decision.mjs \
            netlify/functions/jev-route.mjs \
            wrangler.staging.jsonc \
            wrangler.production.jsonc
          (cd "$RUNNER_TEMP" && sha256sum release.tar.gz > release.tar.gz.sha256)
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        with:
          name: rise-${{ github.sha }}
          path: |
            ${{ runner.temp }}/release.tar.gz
            ${{ runner.temp }}/release.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
