# CI: unit tests, production build, source hygiene, and browser smoke.
# Jobs are separate so a red run names which promise broke.
#
# Concurrency cancels superseded runs on the same ref.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The browser matrix the pull-request gate leaves out. Nightly rather than
  # per-change, because it is fifteen minutes nobody is waiting on.
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

# A second push supersedes the first.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Matches the engines field in package.json.
          node-version: '20.19'
          cache: npm
      # The MP4 encoder adapter hands bytes to the real ffmpeg, because a stub
      # would only prove we can satisfy our own stub. The runner image does not
      # carry it, so the test skipped and nothing on CI ever proved an MP4
      # could be produced at all.
      - name: Install ffmpeg, which the encoder test encodes with
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      # chamber-paint launches Playwright Chromium to capture raw RGBA from a
      # live Chamber stage. npm ci installs the package, not the browser. The
      # runner image does not carry Chromium, so the test failed and nothing
      # on CI ever painted a frame.
      - name: Install Chromium, which the chamber-paint test paints with
        run: npx playwright install --with-deps chromium
      - run: npm run test:run

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19'
          cache: npm
      - run: npm ci
      - run: npm run build
      # A first load can only stay small if something refuses to let it grow.
      # The build itself already fails on a deferral the bundler ignores;
      # this fails on the byte count that deferral was for.
      - name: The Portal's cost is a budget, not an aspiration
        run: npm run measure:first-load

  scriptorium:
    name: Scriptorium CLI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19'
          cache: npm
      - run: npm ci
      # The unit suite drives the CLI's argv shell in-process. This spawns it:
      # `npm run scriptorium` must resolve, vite-node must load a graph that
      # imports division-index.json, and a refusal code must arrive at the
      # shell as the exit status the spec documents (§13). Its own job so a red
      # run names which of those broke.
      - name: A refusal is an exit status
        run: npm run scriptorium:ci

  hygiene:
    name: Source hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19'
          cache: npm
      - run: npm ci
      - name: No secret may travel in a delivery URL
        run: node scripts/ci-hygiene.mjs

  # THE GATE A PULL REQUEST MUST PASS, AND ONLY THAT.
  #
  # This was the whole suite behind a 45-minute cap, raised from 30 after CI
  # #99 (1d6f41e) died at 29m 25s with no assertion. Raising a cap does not
  # make a slow gate safe; it makes it slower, and a gate people wait a
  # quarter of an hour for is one they learn to route around.
  #
  # Measured: 502 seconds of test time across 18 spec files, of which
  # mobile.spec.js alone is 200. The gate project is 134 of those seconds —
  # the corridor a reader walks, the safety warning, the voice, and the
  # refusal panel. This is the fast no. `e2e-full` below runs the complete
  # suite, sharded, on the same pull request, so nothing is deferred: this
  # job only decides whether a change is dead on arrival.
  e2e:
    name: Browser gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19'
          cache: npm
      - run: npm ci
      # Only Chromium. The suite runs one worker against one audio
      # device by design; a browser matrix would not be testing more.
      - run: npx playwright install --with-deps chromium
      # playwright.config.js builds and previews on its own — what ships
      # is what gets tested.
      - run: npm run test:e2e:gate
      - uses: actions/upload-artifact@v4
        if: failure() || cancelled()
        with:
          name: playwright-report-gate
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # THE WHOLE SUITE, ON EVERY PULL REQUEST, IN THE TIME THE SLOWEST FILE TAKES.
  #
  # The reason this job skipped pull requests was latency, not coverage: a
  # gate people wait a quarter of an hour for is one they learn to route
  # around. Sharding pays that with parallelism instead of with coverage.
  # Playwright shards by file, so mobile.spec.js at 200 s is the floor no
  # shard count can go under — which makes four the smallest count that
  # reaches it. 502 s of serial test time becomes ~200 s of wall clock.
  #
  # So the trade the split was making is no longer necessary. `test:e2e` runs
  # both projects, which is all 89 tests in 21 files; verified partitioned
  # 23 / 26 / 24 / 16 by `playwright test --list --shard=N/4`. A regression in
  # the half that used to run after the merge now fails before it, and the
  # nightly run stops being the first place anyone hears about it.
  #
  # `Browser gate` above stays: 134 s is a faster no than this job can give,
  # and it covers the reader's corridor, so a broken corridor still fails
  # first. This is the slower, complete answer behind it.
  e2e-full:
    name: Browser matrix ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # A failing shard must not hide the state of the other three.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: failure() || cancelled()
        with:
          name: playwright-report-full-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
