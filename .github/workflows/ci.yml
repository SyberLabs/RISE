name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Fast release checks
        run: |
          set -euo pipefail
          node scripts/ci-hygiene.mjs
          npm run security:audit
          npm run security:compat
          npm run docs:diagram
          git diff --exit-code -- docs/specs/ARCHITECTURE.md
          npm run content:build
          npx vitest run \
            src/core/system-design.test.js \
            worker/index.test.js \
            worker/jev-recommend.test.js \
            src/components/Library.jev.test.js \
            src/core/content-store.test.js \
            src/core/journey-session.test.js \
            src/audio/engine.lifecycle.test.js \
            src/content/keystones.test.js
          npx vite build
          npm run measure:first-load
      - name: Mark the tested release
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          TESTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$TESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          printf '%s\n' "$TESTED_SHA" > "dist/release-$TESTED_SHA.txt"
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        with:
          name: rise-${{ github.sha }}
          path: |
            dist/
            worker/index.mjs
            worker/jev-recommend.mjs
            src/content/archive/release-inventory.json
            netlify/functions/jev-decision.mjs
            netlify/functions/jev-route.mjs
            package.json
            package-lock.json
            wrangler.production.jsonc
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
  production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # GitHub restricts this environment to main, requires @sdcarlson review,
    # permits owner self-review, and disables administrator bypass.
    environment:
      name: production
      url: https://rise.syberlabs.io
    env:
      TESTED_SHA: ${{ github.sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rise-${{ github.sha }}
          path: release
      - name: Verify the same release artifact
        run: |
          set -euo pipefail
          test "$(cat "$GITHUB_WORKSPACE/release/dist/release-$TESTED_SHA.txt")" = "$TESTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Install production dependencies
        working-directory: release
        run: |
          set -euo pipefail
          npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Recheck main after owner approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$TESTED_SHA" = "$current"
      - name: Record prior production versions and rollback command
        working-directory: release
        run: |
          set -euo pipefail
          # A new production Worker has no deployment history. Only Cloudflare's
          # specific script-not-found error (10007) means an empty history;
          # permission, network, and other API errors must stop the release.
          status=$(curl -sS --max-time 20 --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -o "$RUNNER_TEMP/deployment-history-response.json" -w '%{http_code}' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/rise-production/deployments")
          case "$status" in
            200)
              jq -e '.success == true and (.result.deployments | type == "array")' \
                "$RUNNER_TEMP/deployment-history-response.json" > /dev/null
              jq '.result.deployments' "$RUNNER_TEMP/deployment-history-response.json" \
                > "$RUNNER_TEMP/prior-production-deployments.json"
              ;;
            404)
              jq -e '.success == false and any(.errors[]?; .code == 10007)' \
                "$RUNNER_TEMP/deployment-history-response.json" > /dev/null
              printf '[]\n' > "$RUNNER_TEMP/prior-production-deployments.json"
              ;;
            *)
              echo "Could not verify prior production deployments (Cloudflare HTTP $status)."
              exit 1
              ;;
          esac
          {
            echo '### Production rollback record (before deployment)'
            echo 'Prior deployments and version IDs:'
            echo '```json'
            cat "$RUNNER_TEMP/prior-production-deployments.json"
            echo '```'
            if [ "$(jq length "$RUNNER_TEMP/prior-production-deployments.json")" -eq 0 ]; then
              echo 'No prior production deployment exists; this first release has no Worker rollback version.'
            else
              echo 'If a prior version is independently verified as known-good, restore its **version ID** with:'
              echo '`npx --yes wrangler@4.141.0 rollback <VERSION_ID> --config wrangler.production.jsonc --message "RISE rollback"`'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy production from the verified artifact
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$TESTED_SHA" = "$current"
          npx --yes wrangler@4.141.0 deploy --config wrangler.production.jsonc --message "RISE $TESTED_SHA"
      - name: Verify public production serves the exact release
        run: |
          set -euo pipefail
          # Cloudflare can serve the prior version for a few seconds after deploy.
          for attempt in {1..10}; do
            status=$(curl -sS --max-time 20 --retry 2 --retry-delay 1 --retry-all-errors \
              -o "$RUNNER_TEMP/public-body" -w '%{http_code}' \
              "https://rise.syberlabs.io/release-$TESTED_SHA.txt" || true)
            if [ "$status" = 200 ] && [ "$(cat "$RUNNER_TEMP/public-body")" = "$TESTED_SHA" ]; then
              break
            fi
            if [ "$attempt" = 10 ]; then
              echo "Production did not serve release $TESTED_SHA after 10 checks."
              exit 1
            fi
            sleep 2
          done
          for path in / /try-rise /jev-preview; do
            status=$(curl -sS --max-time 20 --retry 5 --retry-delay 3 --retry-all-errors \
              -D "$RUNNER_TEMP/public-headers" -o "$RUNNER_TEMP/public-body" \
              -w '%{http_code}' "https://rise.syberlabs.io$path")
            test "$status" = 200 || { echo "Expected public HTTP 200 at $path; got HTTP $status"; exit 1; }
          done
          status=$(curl -sS --max-time 20 --retry 5 --retry-delay 3 --retry-all-errors \
            -D "$RUNNER_TEMP/public-headers" -o "$RUNNER_TEMP/public-body" \
            -w '%{http_code}' 'https://rise.syberlabs.io/api/not-a-route')
          test "$status" = 404 || { echo "Expected JSON 404 for unknown API; got HTTP $status"; exit 1; }
          grep -Eiq '^content-type: application/json' "$RUNNER_TEMP/public-headers"
          jq -e '.error.code == "NOT_FOUND"' "$RUNNER_TEMP/public-body" > /dev/null
          status=$(curl -sS --max-time 20 -o "$RUNNER_TEMP/jev-recommend-body" \
            -w '%{http_code}' -H 'Origin: https://rise.syberlabs.io' \
            -H 'Content-Type: application/json' \
            --data '{"intent":"A thoughtful classic about self-examination"}' \
            'https://rise.syberlabs.io/api/jev-recommend')
          test "$status" = 200 || { echo "Jev recommendation returned HTTP $status"; exit 1; }
          jq -e '.model | startswith("typesafe/jev-1.13")' "$RUNNER_TEMP/jev-recommend-body" > /dev/null
          jq -e '.editionId | startswith("standard-ebooks:")' "$RUNNER_TEMP/jev-recommend-body" > /dev/null
          {
            echo "Deployed production artifact $TESTED_SHA; public pages, exact release marker, JSON API 404, and a live Jev recommendation verified."
            echo 'Owner acceptance: open the chosen book in the Library Archive at https://rise.syberlabs.io/.'
          } >> "$GITHUB_STEP_SUMMARY"
