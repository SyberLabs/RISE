name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: CI
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Fast release checks
        run: |
          set -euo pipefail
          node scripts/ci-hygiene.mjs
          node --test scripts/decision-eval.test.mjs local/bridge.test.mjs local/hardware.test.mjs local/launcher.test.mjs
          python3 -m unittest discover -s deploy/kev -p 'test_*.py'
          npm run security:audit &
          audit=$!
          npm run security:compat
          npm run docs:diagram
          git diff --exit-code -- docs/specs/ARCHITECTURE.md
          npm run content:build
          npx vitest run \
            src/core/system-design.test.js \
            worker/index.test.js \
            worker/kev-worker-script.test.js \
            src/core/decision \
            src/core/openrouter-oauth.test.js \
            src/core/kev-client.test.js \
            src/core/csp.test.js \
            src/core/passage-visuals/score-provider.test.js \
            src/core/passage-visuals/scoring-client.test.js \
            src/components/Portal.jev.test.js \
            src/components/Portal.test.js \
            src/components/Library.jev.test.js \
            src/core/content-store.test.js \
            src/core/journey-session.test.js \
            src/audio/engine.lifecycle.test.js \
            src/content/keystones.test.js \
            src/enterprise &
          tests=$!
          npx vite build
          npm run measure:first-load
          wait "$tests"
          wait "$audit"
  production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # GitHub restricts this environment to main. Required PR checks gate merges.
    environment:
      name: production
      url: https://rise.syberlabs.io
    env:
      TESTED_SHA: ${{ github.sha }}
      # The Worker runs no model and holds no model credential; readers bring their
      # own OpenRouter account or run Kev locally.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build production and restore audio
        run: |
          set -euo pipefail
          npm ci --no-audit &
          install=$!
          node scripts/hydrate-recitation.mjs &
          hydrate=$!
          wait "$install"
          npm run build
          wait "$hydrate"
          mkdir -p dist/audio/recitation
          cp -a public/audio/recitation/. dist/audio/recitation/
      - name: Mark the tested release
        run: |
          set -euo pipefail
          [[ "$TESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(find dist/audio/recitation -type f -name '*.wav' | wc -l)" -eq 877
          printf '%s\n' "$TESTED_SHA" > "dist/release-$TESTED_SHA.txt"
          printf '%s\n' "$TESTED_SHA" > dist/release.txt
      - name: Deploy production
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$TESTED_SHA" = "$current"
          ./node_modules/.bin/wrangler deploy --config wrangler.production.jsonc --message "RISE $TESTED_SHA"
      - name: Verify public production serves the exact release
        run: |
          set -euo pipefail
          # Cloudflare can serve the prior version for a few seconds after deploy.
          for attempt in {1..45}; do
            status=$(curl -sS --max-time 20 --retry 2 --retry-delay 1 --retry-all-errors \
              -o "$RUNNER_TEMP/public-body" -w '%{http_code}' \
              "https://rise.syberlabs.io/release-$TESTED_SHA.txt" || true)
            if [ "$status" = 200 ] && [ "$(cat "$RUNNER_TEMP/public-body")" = "$TESTED_SHA" ]; then
              break
            fi
            if [ "$attempt" = 45 ]; then
              echo "Production did not serve release $TESTED_SHA after 45 checks."
              exit 1
            fi
            sleep 1
          done
          for path in / /try-rise; do
            status=$(curl -sS --max-time 20 --retry 5 --retry-delay 3 --retry-all-errors \
              -D "$RUNNER_TEMP/public-headers" -o "$RUNNER_TEMP/public-body" \
              -w '%{http_code}' "https://rise.syberlabs.io$path")
            test "$status" = 200 || { echo "Expected public HTTP 200 at $path; got HTTP $status"; exit 1; }
          done
          status=$(curl -sS --max-time 20 --retry 5 --retry-delay 3 --retry-all-errors \
            -D "$RUNNER_TEMP/public-headers" -o "$RUNNER_TEMP/public-body" \
            -w '%{http_code}' 'https://rise.syberlabs.io/api/not-a-route')
          test "$status" = 404 || { echo "Expected JSON 404 for unknown API; got HTTP $status"; exit 1; }
          grep -Eiq '^content-type: application/json' "$RUNNER_TEMP/public-headers"
          jq -e '.error.code == "NOT_FOUND"' "$RUNNER_TEMP/public-body" > /dev/null
          # No release check may spend inference: the catalog is read-only public data,
          # and every retired model route must answer 410 without calling a model.
          status=$(curl -sS --max-time 20 --retry 5 --retry-delay 3 --retry-all-errors \
            -o "$RUNNER_TEMP/catalog-body" -w '%{http_code}' 'https://rise.syberlabs.io/api/decision-catalog')
          test "$status" = 200 || { echo "Expected the public decision catalog; got HTTP $status"; head -c 600 "$RUNNER_TEMP/catalog-body"; exit 1; }
          CATALOG_FILE="$RUNNER_TEMP/catalog-body" node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { readPublicCatalog } from "./src/core/decision/catalog.js";
            if (!readPublicCatalog(JSON.parse(readFileSync(process.env.CATALOG_FILE, "utf8")))) {
              console.error("The live decision catalog does not pass the browser contract."); process.exit(1);
            }'
          for path in /api/jev-recommend /api/jev-decision /api/jev/route /api/jev-visual-score /api/enterprise-decision /api/personal-piece; do
            status=$(curl -sS --max-time 20 --retry 3 --retry-delay 2 --retry-all-errors \
              -o "$RUNNER_TEMP/retired-body" -w '%{http_code}' -X POST \
              -H 'Origin: https://rise.syberlabs.io' -H 'Content-Type: application/json' \
              --data '{"intent":"A thoughtful classic about self-examination","schemaVersion":3}' \
              "https://rise.syberlabs.io$path")
            test "$status" = 410 || { echo "Retired route $path answered HTTP $status"; exit 1; }
            jq -e '.error.code == "SHARED_INFERENCE_RETIRED"' "$RUNNER_TEMP/retired-body" > /dev/null
          done
          status=$(curl -sS --max-time 20 -o "$RUNNER_TEMP/release-after-checks" \
            -w '%{http_code}' "https://rise.syberlabs.io/release-$TESTED_SHA.txt")
          test "$status" = 200 && test "$(cat "$RUNNER_TEMP/release-after-checks")" = "$TESTED_SHA" || {
            echo "Production changed during the release checks; expected release $TESTED_SHA."
            exit 1
          }
          {
            echo "Deployed production artifact $TESTED_SHA; public pages, exact release marker, JSON API 404, public decision catalog, and every retired inference route (410) verified. No model was called."
            echo 'Owner acceptance: connect your own OpenRouter account at https://rise.syberlabs.io/, ask for a reading, and check that Chamber starts with the selected text and settings.'
          } >> "$GITHUB_STEP_SUMMARY"
