name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: CI
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Fast release checks
        run: |
          set -euo pipefail
          node scripts/ci-hygiene.mjs
          npm run security:audit &
          audit=$!
          npm run security:compat
          npm run docs:diagram
          git diff --exit-code -- docs/specs/ARCHITECTURE.md
          npm run content:build
          npx vitest run \
            src/core/system-design.test.js \
            worker/index.test.js \
            worker/jev-recommend.test.js \
            src/components/Library.jev.test.js \
            src/core/content-store.test.js \
            src/core/journey-session.test.js \
            src/audio/engine.lifecycle.test.js \
            src/content/keystones.test.js &
          tests=$!
          npx vite build
          npm run measure:first-load
          wait "$tests"
          wait "$audit"
  production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # GitHub restricts this environment to main. Required PR checks gate merges.
    environment:
      name: production
      url: https://rise.syberlabs.io
    env:
      TESTED_SHA: ${{ github.sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build production and restore audio
        run: |
          set -euo pipefail
          npm ci --no-audit &
          install=$!
          node scripts/hydrate-recitation.mjs &
          hydrate=$!
          wait "$install"
          npm run build
          wait "$hydrate"
          mkdir -p dist/audio/recitation
          cp -a public/audio/recitation/. dist/audio/recitation/
      - name: Mark the tested release
        run: |
          set -euo pipefail
          [[ "$TESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(find dist/audio/recitation -type f -name '*.wav' | wc -l)" -eq 877
          printf '%s\n' "$TESTED_SHA" > "dist/release-$TESTED_SHA.txt"
      - name: Deploy production
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$TESTED_SHA" = "$current"
          ./node_modules/.bin/wrangler deploy --config wrangler.production.jsonc --message "RISE $TESTED_SHA"
      - name: Verify public production serves the exact release
        run: |
          set -euo pipefail
          # Cloudflare can serve the prior version for a few seconds after deploy.
          for attempt in {1..45}; do
            status=$(curl -sS --max-time 20 --retry 2 --retry-delay 1 --retry-all-errors \
              -o "$RUNNER_TEMP/public-body" -w '%{http_code}' \
              "https://rise.syberlabs.io/release-$TESTED_SHA.txt" || true)
            if [ "$status" = 200 ] && [ "$(cat "$RUNNER_TEMP/public-body")" = "$TESTED_SHA" ]; then
              break
            fi
            if [ "$attempt" = 45 ]; then
              echo "Production did not serve release $TESTED_SHA after 45 checks."
              exit 1
            fi
            sleep 1
          done
          for path in / /try-rise /jev-preview; do
            status=$(curl -sS --max-time 20 --retry 5 --retry-delay 3 --retry-all-errors \
              -D "$RUNNER_TEMP/public-headers" -o "$RUNNER_TEMP/public-body" \
              -w '%{http_code}' "https://rise.syberlabs.io$path")
            test "$status" = 200 || { echo "Expected public HTTP 200 at $path; got HTTP $status"; exit 1; }
          done
          status=$(curl -sS --max-time 20 --retry 5 --retry-delay 3 --retry-all-errors \
            -D "$RUNNER_TEMP/public-headers" -o "$RUNNER_TEMP/public-body" \
            -w '%{http_code}' 'https://rise.syberlabs.io/api/not-a-route')
          test "$status" = 404 || { echo "Expected JSON 404 for unknown API; got HTTP $status"; exit 1; }
          grep -Eiq '^content-type: application/json' "$RUNNER_TEMP/public-headers"
          jq -e '.error.code == "NOT_FOUND"' "$RUNNER_TEMP/public-body" > /dev/null
          status=$(curl -sS --max-time 20 -o "$RUNNER_TEMP/jev-recommend-body" \
            -w '%{http_code}' -H 'Origin: https://rise.syberlabs.io' \
            -H 'Content-Type: application/json' \
            --data '{"intent":"A thoughtful classic about self-examination"}' \
            'https://rise.syberlabs.io/api/jev-recommend')
          test "$status" = 200 || { echo "Jev recommendation returned HTTP $status"; exit 1; }
          node --input-type=module -e "import { JEV_PALETTES } from './src/core/jev-palette.js'; console.log(JSON.stringify(JEV_PALETTES))" \
            > "$RUNNER_TEMP/jev-palettes.json"
          JEV_RESPONSE_FILE="$RUNNER_TEMP/jev-recommend-body" node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { resolveJevChamberConfig } from "./src/core/jev-config.js";
            import { compileJevVisualProgram } from "./src/core/jev-sequence.js";
            const config = JSON.parse(readFileSync(process.env.JEV_RESPONSE_FILE, "utf8")).config;
            console.log(JSON.stringify({ ...resolveJevChamberConfig(config),
              visualProgram: compileJevVisualProgram(config) }));
          ' > "$RUNNER_TEMP/jev-resolved.json"
          jq -e --slurpfile editions src/content/archive/release-inventory.json \
            --slurpfile palettes "$RUNNER_TEMP/jev-palettes.json" \
            --slurpfile resolved "$RUNNER_TEMP/jev-resolved.json" '
            . as $result
            | $editions[0][$result.workId] as $edition
            | ($result.model | startswith("typesafe/jev-1.13"))
              and ($result.requestId | type == "string" and length > 0)
              and ($edition != null)
              and ($result.editionId == $edition.editionId)
              and ($result.sourceRevision == $edition.sourceRevision)
              and ($result.config | keys | sort) ==
                (["section", "wpm", "curve", "chunkMode", "audio", "visualMode", "visualStyle",
                  "visualEngine", "visualArc", "arcSplit", "middleEngine", "finaleEngine",
                  "visualPalette", "kleePreset", "galleryCadence", "chamberFace",
                  "fontSize", "colorTheme", "colors", "wordFill", "projection", "revealMode",
                  "audioPreset", "soundscape", "entrainmentMode", "entrainmentWaveform",
                  "recitation", "voiceId", "visualConfig", "presentation", "visualProgram"] | sort)
              and ([100, 150, 200, 250, 300, 400, 500] | index($result.config.wpm)) != null
              and (["flat", "induction", "ascent", "wave", "climax"] | index($result.config.curve)) != null
              and (["word", "phrase", "sentence", "paragraph"] | index($result.config.chunkMode)) != null
              and (["silent", "aurora", "faded-signal", "sad", "angry", "happy", "excited", "thrilling", "scary"] | index($result.config.audio)) != null
              and (["off", "focals", "genesis", "attractor", "interlocution"] | index($result.config.visualMode)) != null
              and (["quiet", "gentle", "immersive", "psychedelic"] | index($result.config.visualStyle)) != null
              and (["klee", "turrell", "fractal", "harmonograph", "ostensoria", "apparitio"] | index($result.config.visualEngine)) != null
              and (["single", "dual", "triple"] | index($result.config.visualArc)) != null
              and (["30", "50", "70"] | index($result.config.arcSplit)) != null
              and (["klee", "turrell", "fractal", "harmonograph", "ostensoria", "apparitio"] | index($result.config.middleEngine)) != null
              and (["klee", "turrell", "fractal", "harmonograph", "ostensoria", "apparitio"] | index($result.config.finaleEngine)) != null
              and (["white", "red", "blue", "gold", "purple"] | index($result.config.visualPalette)) != null
              and (["random", "architectural", "chaotic", "harmonic", "gravitational", "twittering"] | index($result.config.kleePreset)) != null
              and (["slow", "balanced", "lively"] | index($result.config.galleryCadence)) != null
              and (["literary", "display", "thick", "jp"] | index($result.config.chamberFace)) != null
              and (["small", "medium", "large", "fit"] | index($result.config.fontSize)) != null
              and (["plain", "accent", "same"] | index($result.config.wordFill)) != null
              and ($result.config.colors == $palettes[0][$result.config.colorTheme])
              and (["stream", "page"] | index($result.config.projection)) != null
              and (["instant", "progressive"] | index($result.config.revealMode)) != null
              and (["first", "middle", "last", "shortest", "longest"] | index($result.config.section)) != null
              and ($result.config.audioPreset == $resolved[0].audioPreset)
              and ($result.config.soundscape == $resolved[0].soundscape)
              and ($result.config.entrainmentMode == $resolved[0].entrainmentMode)
              and ($result.config.entrainmentWaveform == $resolved[0].entrainmentWaveform)
              and ($result.config.recitation == $resolved[0].recitation)
              and ($result.config.voiceId == $resolved[0].voiceId)
              and ($result.config.visualConfig == $resolved[0].visualConfig)
              and ($result.config.visualProgram == $resolved[0].visualProgram)
              and (if $result.config.visualArc == "single" then
                $result.config.visualProgram == null
              else $result.config.visualProgram != null end)
              and ($result.config.presentation == $resolved[0].presentation)
              and ($result.config.projection == $resolved[0].projection)
              and (if $result.config.visualStyle == "psychedelic" then
                $result.config.visualMode == "interlocution"
                and $result.config.visualEngine == "fractal"
                and $result.config.galleryCadence == "lively"
                and $result.config.colorTheme == "prism"
                and $result.config.projection == "stream"
              else true end)
              and (if $result.config.visualStyle == "immersive"
                or $result.config.visualMode == "genesis"
                or $result.config.visualMode == "attractor"
                or $result.config.visualMode == "interlocution"
                then $result.config.projection == "stream" else true end)
              and (if $result.config.wordFill == "same" then
                $result.config.visualMode == "interlocution"
                and $result.config.chamberFace == "thick"
                and $result.config.fontSize == "fit"
                and $result.config.chunkMode == "word"
              else true end)
              and ($result | has("text") | not)
              and ($result | has("reading") | not)
          ' "$RUNNER_TEMP/jev-recommend-body" > /dev/null
          status=$(curl -sS --max-time 20 -o "$RUNNER_TEMP/release-after-jev" \
            -w '%{http_code}' "https://rise.syberlabs.io/release-$TESTED_SHA.txt")
          test "$status" = 200 && test "$(cat "$RUNNER_TEMP/release-after-jev")" = "$TESTED_SHA" || {
            echo "Production changed during the Jev smoke check; expected release $TESTED_SHA."
            exit 1
          }
          {
            echo "Deployed production artifact $TESTED_SHA; public pages, exact release marker, JSON API 404, and one live Jev reading configuration verified."
            echo 'Owner acceptance: ask Jev for a reading at https://rise.syberlabs.io/ and check that Chamber starts with the selected text and settings.'
          } >> "$GITHUB_STEP_SUMMARY"
