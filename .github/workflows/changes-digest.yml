# RISE Changes (docs/plans/RISE-CHANGES.md): once a week, the pull requests
# merged into main become one narrated digest for the team. The script routes
# and composes with Claude through the Claude Code CLI, admits the Current with
# RISE's own validators, and writes two files; this job commits them to the
# orphan data branch `changes-data` (never main) and opens one issue that links
# the reading. A run with nothing included writes nothing and opens no issue.
# This job is never a required check and never runs on pull requests.
name: Changes digest

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      since:
        description: 'Start of the period (ISO date or time). Empty: the newest digest''s end, or seven days back.'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Write the files to the runner only: push nothing, open no issue.'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: changes-digest
  cancel-in-progress: false

jobs:
  digest:
    name: Write the week's digest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # Node 22 for this job only: the Claude Code CLI requires it (package.json's engines allow >=22.12.0).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.3
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      # The rendered check draws each figure in Chromium (scripts/changes/render-check.mjs). npx runs the
      # Playwright that npm ci installed, so the browser is the build the lockfile pins.
      - name: Install Chromium for the rendered check
        run: npx playwright install --with-deps chromium

      # Pinned; the npm package installs the native binary (https://code.claude.com/docs/en/setup#install-with-npm).
      - name: Install the Claude Code CLI
        run: |
          npm install --global --no-fund --no-audit @anthropic-ai/claude-code@2.1.287
          claude --version

      - name: Route, compose and admit the digest
        id: digest
        env:
          GH_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SINCE: ${{ inputs.since }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/changes"
          args=(--out "$out")
          if [ -n "${SINCE:-}" ]; then args+=(--since "$SINCE"); fi
          if [ "${DRY_RUN:-false}" = 'true' ]; then args+=(--dry-run); fi
          node scripts/changes/digest.mjs "${args[@]}"
          written=$(jq -r '.written' "$out/run.json")
          echo "written=$written" >> "$GITHUB_OUTPUT"
          if [ "$written" = 'true' ]; then
            id=$(jq -r '.id' "$out/run.json")
            if ! [[ "$id" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}(-[a-z0-9]{1,8})?$ ]]; then
              echo "::error::The digest id is not the contract's id."
              exit 1
            fi
            echo "id=$id" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Nothing written: $(jq -r '.reason' "$out/run.json")"
          fi

      - name: Show what a dry run wrote
        if: steps.digest.outputs.written == 'true' && inputs.dry_run
        env:
          ID: ${{ steps.digest.outputs.id }}
        run: |
          cat "$RUNNER_TEMP/changes/issue.json"
          cat "$RUNNER_TEMP/changes/index.json"
          cat "$RUNNER_TEMP/changes/$ID.json"

      - name: Find the data branch
        id: branch
        if: steps.digest.outputs.written == 'true' && !inputs.dry_run
        run: |
          if git ls-remote --exit-code --heads origin changes-data > /dev/null; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi

      # Credentials are kept in this checkout only, after every dependency script has run.
      - name: Check out the data branch
        if: steps.digest.outputs.written == 'true' && !inputs.dry_run
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ steps.branch.outputs.exists == 'true' && 'changes-data' || github.event.repository.default_branch }}
          path: changes-data

      - name: Commit the digest to changes-data
        if: steps.digest.outputs.written == 'true' && !inputs.dry_run
        env:
          ID: ${{ steps.digest.outputs.id }}
          EXISTS: ${{ steps.branch.outputs.exists }}
        working-directory: changes-data
        run: |
          set -euo pipefail
          if [ "$EXISTS" != 'true' ]; then
            git checkout --orphan changes-data
            git rm -rfq --ignore-unmatch .
            cat > README.md <<'README'
          # changes-data

          The data of RISE Changes: one JSON file per weekly digest (`<id>.json`) and
          `index.json`, written by `.github/workflows/changes-digest.yml` on main and
          served by RISE at `/content/changes/<file>`. The format is
          `docs/plans/RISE-CHANGES.md` on main. Nothing here is built or deployed;
          do not edit these files by hand.
          README
          fi
          cp "$RUNNER_TEMP/changes/$ID.json" "$RUNNER_TEMP/changes/index.json" .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md index.json "$ID.json"
          git commit -m "Changes digest $ID"
          git push origin HEAD:refs/heads/changes-data

      - name: Open the notification issue
        if: steps.digest.outputs.written == 'true' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          issue="$RUNNER_TEMP/changes/issue.json"
          gh label create changes-digest --repo "$GITHUB_REPOSITORY" --color 1d76db \
            --description 'A weekly RISE Changes digest is ready' --force
          jq -r '.body' "$issue" > "$RUNNER_TEMP/changes/issue.md"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$(jq -r '.title' "$issue")" \
            --body-file "$RUNNER_TEMP/changes/issue.md" --label changes-digest
