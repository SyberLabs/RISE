name: Deploy recitation audio

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Publish immutable audio separately from the app
        run: |
          set -euo pipefail
          mkdir -p audio-dist/audio
          cp -a public/audio/recitation audio-dist/audio/
          source_count=$(find public/audio/recitation -name '*.wav' | wc -l)
          test "$source_count" -gt 0
          test "$(find audio-dist/audio/recitation -name '*.wav' | wc -l)" -eq "$source_count"
          ./node_modules/.bin/wrangler deploy --config wrangler.audio.jsonc
      - name: Verify the routed audio matches the source
        run: |
          set -euo pipefail
          for attempt in {1..10}; do
            status=$(curl -sS --max-time 20 -D "$RUNNER_TEMP/headers" \
              -o "$RUNNER_TEMP/body" -w '%{http_code}' \
              https://rise.syberlabs.io/audio/recitation/af_heart/10-1237qhv.wav || true)
            if [ "$status" = 200 ] &&
               grep -Eiq '^content-type: audio/wav' "$RUNNER_TEMP/headers" &&
               cmp -s "$RUNNER_TEMP/body" public/audio/recitation/af_heart/10-1237qhv.wav; then
              exit 0
            fi
            sleep 2
          done
          echo 'Routed audio did not match the source.'
          exit 1
