# workflow_run has deployment authority. Only a successful push CI run for the
# current main commit may reach either Cloudflare environment.
name: RISE Cloudflare

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: rise-cloudflare
  cancel-in-progress: false

jobs:
  source:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.check.outputs.sha }}
      artifact: ${{ steps.check.outputs.artifact }}
    steps:
      - name: CI tested the current main commit
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "$TESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$TESTED_SHA" = "$current"
          echo "sha=$TESTED_SHA" >> "$GITHUB_OUTPUT"
          echo "artifact=rise-$TESTED_SHA" >> "$GITHUB_OUTPUT"

  build:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Pack the only release artifact
        env:
          TESTED_SHA: ${{ needs.source.outputs.sha }}
        run: |
          set -euo pipefail
          printf '%s\n' "$TESTED_SHA" > "dist/release-$TESTED_SHA.txt"
          tar -czf "$RUNNER_TEMP/release.tar.gz" \
            dist \
            worker/index.mjs \
            worker/jev-recommend.mjs \
            src/content/archive/release-inventory.json \
            netlify/functions/jev-decision.mjs \
            netlify/functions/jev-route.mjs \
            package.json \
            package-lock.json \
            wrangler.staging.jsonc \
            wrangler.production.jsonc
          (cd "$RUNNER_TEMP" && sha256sum release.tar.gz > release.tar.gz.sha256)
      - name: Bundle the unpacked release exactly as staging will
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-smoke"
          tar -xzf "$RUNNER_TEMP/release.tar.gz" -C "$RUNNER_TEMP/release-smoke"
          cd "$RUNNER_TEMP/release-smoke"
          npm ci --omit=dev --ignore-scripts --no-audit --no-fund
          npx --yes wrangler@4.141.0 deploy --dry-run --config wrangler.staging.jsonc \
            --outdir "$RUNNER_TEMP/worker-dry-run"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.source.outputs.artifact }}
          path: |
            ${{ runner.temp }}/release.tar.gz
            ${{ runner.temp }}/release.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  staging:
    needs: [source, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    env:
      TESTED_SHA: ${{ needs.source.outputs.sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_URL: ${{ vars.STAGING_URL }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.source.outputs.artifact }}
          path: ${{ runner.temp }}/release
      - name: Verify and unpack the release artifact
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/release"
          sha256sum -c release.tar.gz.sha256
          mkdir -p "$GITHUB_WORKSPACE/release"
          tar -xzf release.tar.gz -C "$GITHUB_WORKSPACE/release"
          test "$(cat "$GITHUB_WORKSPACE/release/dist/release-$TESTED_SHA.txt")" = "$TESTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Install locked Worker dependencies
        working-directory: release
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Recheck main and staging configuration before deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          [[ "$STAGING_URL" =~ ^https://[a-z0-9-]+\.[a-z0-9-]+\.workers\.dev/?$ ]]
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$TESTED_SHA" = "$current"
      - name: Deploy staging
        id: deploy_staging
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$TESTED_SHA" = "$current"
          npx --yes wrangler@4.141.0 deploy --config wrangler.staging.jsonc --message "RISE $TESTED_SHA"
      - name: Diagnose scoped Cloudflare metadata access after deploy failure
        if: ${{ failure() && steps.deploy_staging.outcome == 'failure' }}
        run: |
          set -euo pipefail
          paths=(
            "bindings /accounts/$CLOUDFLARE_ACCOUNT_ID/workers/services/rise-jev-preview/environments/production/bindings"
            "routes /accounts/$CLOUDFLARE_ACCOUNT_ID/workers/services/rise-jev-preview/environments/production/routes?show_zonename=true"
            "domains /accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains/records?page=0&per_page=5&service=rise-jev-preview&environment=production"
            "subdomain /accounts/$CLOUDFLARE_ACCOUNT_ID/workers/services/rise-jev-preview/environments/production/subdomain"
            "environment /accounts/$CLOUDFLARE_ACCOUNT_ID/workers/services/rise-jev-preview/environments/production"
            "schedules /accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/rise-jev-preview/schedules"
          )
          for item in "${paths[@]}"; do
            label=${item%% *}
            path=${item#* }
            if ! status=$(curl -sS --max-time 20 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -o "$RUNNER_TEMP/cloudflare-metadata.json" -w '%{http_code}' \
              "https://api.cloudflare.com/client/v4$path"); then
              echo "Cloudflare metadata $label: transport failure"
              continue
            fi
            code=$(jq -r 'if .success == true then "ok" else ([.errors[]?.code | tostring] | join(",")) end' \
              "$RUNNER_TEMP/cloudflare-metadata.json" 2>/dev/null || echo non-json)
            echo "Cloudflare metadata $label: HTTP $status, code ${code:-unknown}"
          done
      - name: Confirm unauthenticated staging stays behind Access
        run: |
          set -euo pipefail
          status=$(curl -sS --max-time 20 -D "$RUNNER_TEMP/access-headers" \
            -o "$RUNNER_TEMP/access-body" -w '%{http_code}' \
            "${STAGING_URL%/}/release-$TESTED_SHA.txt")
          case "$status" in 302|303|307) ;; *) echo "Expected an Access login redirect; got HTTP $status"; exit 1 ;; esac
          grep -i '^location:' "$RUNNER_TEMP/access-headers" \
            | grep -Eiq 'cloudflareaccess\.com|/cdn-cgi/access/'
      - name: Signed-in staging acceptance before approving production
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ### RISE staging ready for owner review
          - Source commit: \`$TESTED_SHA\`
          - Sign in at $STAGING_URL and check the home page, a deep link, and security headers.
          - Confirm \`/release-$TESTED_SHA.txt\` returns this exact commit and an unknown \`/api/*\` returns a JSON 404.
          - At \`/jev-preview.html\`, explicitly click once for a paid Jev decision, then compare OpenRouter usage and bounded Cloudflare logs.
          - Approve production only after these checks pass and the public domain is ready.
          EOF

  production:
    needs: [source, build, staging]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # GitHub restricts this environment to main, requires @sdcarlson review,
    # permits owner self-review, and disables administrator bypass.
    environment:
      name: production
      url: https://rise.syberlabs.io
    env:
      TESTED_SHA: ${{ needs.source.outputs.sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.source.outputs.artifact }}
          path: ${{ runner.temp }}/release
      - name: Verify and unpack the same release artifact
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/release"
          sha256sum -c release.tar.gz.sha256
          mkdir -p "$GITHUB_WORKSPACE/release"
          tar -xzf release.tar.gz -C "$GITHUB_WORKSPACE/release"
          test "$(cat "$GITHUB_WORKSPACE/release/dist/release-$TESTED_SHA.txt")" = "$TESTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Install locked Worker dependencies
        working-directory: release
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Recheck main after staging and owner approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$TESTED_SHA" = "$current"
      - name: Record prior production versions and rollback command
        working-directory: release
        run: |
          set -euo pipefail
          # A new production Worker has no deployment history. Only Cloudflare's
          # specific script-not-found error (10007) means an empty history;
          # permission, network, and other API errors must stop the release.
          status=$(curl -sS --max-time 20 --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -o "$RUNNER_TEMP/deployment-history-response.json" -w '%{http_code}' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/rise-production/deployments")
          case "$status" in
            200)
              jq -e '.success == true and (.result.deployments | type == "array")' \
                "$RUNNER_TEMP/deployment-history-response.json" > /dev/null
              jq '.result.deployments' "$RUNNER_TEMP/deployment-history-response.json" \
                > "$RUNNER_TEMP/prior-production-deployments.json"
              ;;
            404)
              jq -e '.success == false and any(.errors[]?; .code == 10007)' \
                "$RUNNER_TEMP/deployment-history-response.json" > /dev/null
              printf '[]\n' > "$RUNNER_TEMP/prior-production-deployments.json"
              ;;
            *)
              echo "Could not verify prior production deployments (Cloudflare HTTP $status)."
              exit 1
              ;;
          esac
          {
            echo '### Production rollback record (before deployment)'
            echo 'Prior deployments and version IDs:'
            echo '```json'
            cat "$RUNNER_TEMP/prior-production-deployments.json"
            echo '```'
            if [ "$(jq length "$RUNNER_TEMP/prior-production-deployments.json")" -eq 0 ]; then
              echo 'No prior production deployment exists; this first release has no Worker rollback version.'
            else
              echo 'If a prior version is independently verified as known-good, restore its **version ID** with:'
              echo '`npx --yes wrangler@4.141.0 rollback <VERSION_ID> --config wrangler.production.jsonc --message "RISE rollback"`'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy production from the verified artifact
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$TESTED_SHA" = "$current"
          npx --yes wrangler@4.141.0 deploy --config wrangler.production.jsonc --message "RISE $TESTED_SHA"
      - name: Verify public production serves the exact release
        run: |
          set -euo pipefail
          for path in / /try-rise /jev-preview "/release-$TESTED_SHA.txt"; do
            status=$(curl -sS --max-time 20 --retry 5 --retry-delay 3 --retry-all-errors \
              -D "$RUNNER_TEMP/public-headers" -o "$RUNNER_TEMP/public-body" \
              -w '%{http_code}' "https://rise.syberlabs.io$path")
            test "$status" = 200 || { echo "Expected public HTTP 200 at $path; got HTTP $status"; exit 1; }
            if [ "$path" = "/release-$TESTED_SHA.txt" ]; then
              test "$(cat "$RUNNER_TEMP/public-body")" = "$TESTED_SHA"
            fi
          done
          status=$(curl -sS --max-time 20 --retry 5 --retry-delay 3 --retry-all-errors \
            -D "$RUNNER_TEMP/public-headers" -o "$RUNNER_TEMP/public-body" \
            -w '%{http_code}' 'https://rise.syberlabs.io/api/not-a-route')
          test "$status" = 404 || { echo "Expected JSON 404 for unknown API; got HTTP $status"; exit 1; }
          grep -Eiq '^content-type: application/json' "$RUNNER_TEMP/public-headers"
          jq -e '.error.code == "NOT_FOUND"' "$RUNNER_TEMP/public-body" > /dev/null
          {
            echo "Deployed production artifact $TESTED_SHA; public pages, exact release marker, and JSON API 404 verified."
            echo 'Owner acceptance: make one live Jev preview decision at https://rise.syberlabs.io/jev-preview and confirm Relay remains behind Access.'
          } >> "$GITHUB_STEP_SUMMARY"
